<!doctype html>
<html lang="en" data-theme="gameshow">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz · Live</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.6.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="/assets/quiz.css">
</head>
<body class="stage">
<div id="map"></div>
<div class="top">
  <div class="hud"><span id="rno"></span><span class="t" id="gtitle">Live</span><span class="tot" id="tot"></span></div>
  <div class="bar" id="bar"></div>
  <h1 class="q" id="question">Loading…</h1>
  <span class="hint" id="hint"></span>
</div>
<div id="answer" hidden></div>
<button id="action" hidden></button>
<div id="panel" class="sheet" hidden aria-live="polite"></div>
<div id="host" hidden>
  <h2>Host</h2>
  <div class="link"><input id="joinlink" readonly aria-label="Join link"><button id="copy">Copy</button></div>
  <div class="count" id="count"></div>
  <div class="plist" id="plist"></div>
  <button id="next"></button>
  <button id="end">End session</button>
</div>
<div class="ov" id="nameov" hidden><div class="card">
  <h1 id="wtitle">Live</h1>
  <p>Type your name to join. When the host opens a round, tap the globe, type, or pick your answer.</p>
  <p class="err" id="nameerr" hidden></p>
  <input id="pname" maxlength="40" placeholder="Your name" aria-label="Your name" autocomplete="off">
  <button class="go" id="join">Join</button>
</div></div>
<div class="ov" id="endov" hidden><div class="card">
  <h1 id="endtitle"></h1>
  <p id="endsub">Final scoreboard</p>
  <div id="board"></div>
</div></div>
<div class="credit">Imagery © Esri &amp; contributors · MapLibre</div>
<script type="module">
import * as maplibregl from 'https://cdn.jsdelivr.net/npm/maplibre-gl@6.6.0/dist/maplibre-gl.mjs';
import { RM, el, applyTheme, w, verdictChip, flaps, countUp, confetti, pinElement, answerWidget, hud, stage, finalBoard, fmtNum }
  from '/assets/ui.js';

const $ = (id) => document.getElementById(id);
const code = location.pathname.split('/').filter(Boolean).pop();
const HOST = location.pathname.startsWith('/host/');
const KEY = `maptap:live:${code}`;
let token = null;
try { token = localStorage.getItem(KEY); } catch {}
const api = (p, opts) => fetch(`/live/api/${code}${p}`, opts);
const postJson = (p, body) => api(p, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
if (HOST) document.body.classList.add('host');

const map = new maplibregl.Map({
  container: 'map',
  attributionControl: false, // the .credit line carries the Esri notice
  minZoom: 1, maxZoom: 17, center: [10, 25], zoom: 1.6,
  style: { version: 8,
    projection: { type: 'globe' },
    sources: { sat: { type: 'raster', tileSize: 256, maxzoom: 17,
      attribution: 'Imagery © Esri & contributors',
      tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'] } },
    layers: [{ id: 'sat', type: 'raster', source: 'sat' }],
    sky: { 'sky-color': '#02040f', 'horizon-color': '#0e5d7a', 'fog-color': '#070b1c',
      'sky-horizon-blend': 0.6, 'horizon-fog-blend': 0.6,
      'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 1, 6, 1, 8, 0.1] } },
});
window.map = map; // console/debug handle

const EMPTY = { type: 'FeatureCollection', features: [] };
let ready = false; // map.loaded() is false whenever tiles are in flight and 'load' fires once, so track readiness ourselves
// The reveal geometry as a feature: the round's shape, or a point at the anchor.
const truthFeature = (t) => ({ type: 'Feature', geometry: t.geometry || { type: 'Point', coordinates: [t.lng, t.lat] } });
// Extend bounds by every position of a geometry.
const extendBy = (bounds, geometry) => {
  const walk = (c) => (typeof c[0] === 'number' ? bounds.extend(c) : c.forEach(walk));
  walk(geometry.coordinates);
  return bounds;
};
map.on('load', () => {
  map.addSource('truth', { type: 'geojson', data: EMPTY });
  map.addSource('lines', { type: 'geojson', data: EMPTY });
  // A shape round renders as fill + outline, a point round as the dot — geometry-type picks per feature.
  map.addLayer({ id: 'truth-fill', type: 'fill', source: 'truth', filter: ['==', ['geometry-type'], 'Polygon'],
    paint: { 'fill-color': '#ffd15c', 'fill-opacity': 0.25 } });
  map.addLayer({ id: 'lines', type: 'line', source: 'lines',
    paint: { 'line-color': '#ffffff', 'line-opacity': .7, 'line-width': 1.5, 'line-dasharray': [1.5, 1.5] } });
  map.addLayer({ id: 'truth-line', type: 'line', source: 'truth', filter: ['!=', ['geometry-type'], 'Point'],
    paint: { 'line-color': '#ffd15c', 'line-width': 3 } });
  map.addLayer({ id: 'truth', type: 'circle', source: 'truth', filter: ['==', ['geometry-type'], 'Point'],
    paint: { 'circle-radius': 8, 'circle-color': '#ffd15c', 'circle-stroke-color': '#070b1c', 'circle-stroke-width': 3 } });
  ready = true;
});
const whenLoaded = (fn) => (ready ? fn() : map.once('load', fn));

let snap = null;           // latest server snapshot
let shown = { state: null, ord: null }; // what the screen currently reflects, to know when to reset
let marker = null;         // my draggable pin while a location round is open
let sent = false;          // my current answer has been accepted by the server
let pins = [];             // DOM markers on the reveal
let pick = null;           // my typed / chosen / estimated answer on non-location rounds
let themed = false;

function setQ(question, hint = '', soft = false) {
  $('question').textContent = question;
  $('hint').textContent = hint;
  $('hint').classList.toggle('soft', soft);
  $('hint').classList.remove('all');
}
const isMe = (playerId) => !!(snap.you && snap.you.playerId === playerId);
const photoUrl = (file) => `/live/api/${code}/photo/${file}`;
const isLoc = () => !snap.round || snap.round.type === 'location';
// A player's answer as text, for the reveal table.
const answerText = (a) => (snap.round.type === 'choice' ? snap.round.options[a] ?? '?'
  : snap.round.type === 'number' ? `${fmtNum(a)}${snap.round.unit ? ' ' + snap.round.unit : ''}` : `“${a}”`);
const myTotal = () => (snap.standings.find((s) => isMe(s.playerId)) || {}).total;

function clearGlobe() {
  if (marker) { marker.remove(); marker = null; }
  for (const p of pins) p.remove();
  pins = [];
  whenLoaded(() => { map.getSource('truth').setData(EMPTY); map.getSource('lines').setData(EMPTY); });
}

// Built once per round (rebroadcasts must not wipe what the player is typing).
function buildAnswer() {
  pick = null;
  if (isLoc()) { $('answer').replaceChildren(); return; }
  answerWidget($('answer'), snap.round, { readOnly: HOST, onEnter: confirmGuess,
    onChange: (v) => { pick = v; sent = false; renderOpen(); } });
}

function renderLobby() {
  hud($('rno'), $('bar'), null, 0);
  setQ(HOST ? 'Waiting for players…' : 'Waiting for the host to start…', `${snap.players.length} joined`, true);
  const panel = $('panel');
  panel.replaceChildren();
  if (HOST) {
    panel.appendChild(el('h2', null, 'Join on your phone'));
    panel.appendChild(el('div', 'joinurl', `${location.host}/live/${code}`));
  }
  panel.appendChild(el('h2', null, 'Players'));
  const names = el('div', 'names');
  for (const p of snap.players) names.appendChild(el('span', null, p.name));
  if (!snap.players.length) names.appendChild(el('span', null, 'nobody yet'));
  panel.appendChild(names);
  panel.hidden = false;
  $('action').hidden = true;
  $('answer').hidden = true;
}

function renderOpen() {
  const loc = isLoc();
  const me = snap.players.find((p) => isMe(p.id));
  const answered = !!(me && me.answered);
  const done = snap.players.filter((p) => p.answered).length;
  const all = done > 0 && done === snap.players.length;
  let hint = w().hint[snap.round.type], soft = false;
  if (HOST) { hint = all ? w().allin : `${done} of ${snap.players.length} answered`; soft = true; }
  else if (loc && marker && !sent) { hint = 'Drag the pin to fine-tune'; soft = true; }
  else if (answered && (sent || (loc ? !marker : pick == null))) {
    hint = all ? `${w().allin} · reveal coming up` : loc ? 'Answer sent · tap again to change' : 'Answer sent · change it until the reveal'; soft = true;
  }
  hud($('rno'), $('bar'), snap.round.ord, snap.roundCount);
  setQ(snap.round.question, hint, soft);
  $('hint').classList.toggle('all', all && (HOST || answered));
  $('panel').hidden = true;
  $('answer').hidden = loc || !$('answer').children.length;
  $('action').textContent = w().lock;
  $('action').hidden = HOST || sent || (loc ? !marker : pick == null);
}

// My own result on top of the reveal panel: verdict, count-up points, confetti once.
function myResult(panel, guesses, roundChanged) {
  if (HOST) return;
  const mine = guesses.find((g) => isMe(g.playerId));
  const pts = mine ? mine.points : 0;
  panel.appendChild(verdictChip(pts));
  const n = panel.appendChild(el('div', 'pts'));
  if (roundChanged) { countUp(n, pts); if (pts >= 100) confetti(); } else n.textContent = `+${pts}`;
}
function answerLabel(panel, label) {
  if (label) panel.appendChild(label.length <= 26 ? flaps(label, true) : el('div', 'ans', label));
}
function extras(panel, truth) {
  if (truth.photo) { const img = el('img'); img.src = photoUrl(truth.photo); img.alt = truth.answer || 'photo'; panel.appendChild(img); }
  if (truth.story) panel.appendChild(el('div', 'story', truth.story));
}

function renderReveal(roundChanged) {
  const { truth, guesses } = snap.reveal;
  if (!roundChanged && !$('panel').hidden) return; // a rebroadcast (someone joined): keep pins, panel and its animations
  hud($('rno'), $('bar'), snap.round.ord, snap.roundCount);
  setQ(snap.round.question);
  $('action').hidden = true;
  $('answer').hidden = true;
  if (marker) { marker.remove(); marker = null; }
  for (const p of pins) p.remove();
  pins = [];
  if (!isLoc()) return renderAnswerReveal(truth, guesses, roundChanged);
  pins = guesses.map((g) => {
    const node = el('div', 'pin' + (isMe(g.playerId) ? ' mine' : ''));
    node.appendChild(el('span', 'dot'));
    node.appendChild(el('span', 'name', g.name));
    // anchor left + offset −6 px puts the 12 px dot's centre on the point; the name trails to the right
    return new maplibregl.Marker({ element: node, anchor: 'left', offset: [-6, 0] }).setLngLat([g.lng, g.lat]).addTo(map);
  });
  whenLoaded(() => {
    const tf = truthFeature(truth);
    map.getSource('truth').setData(tf);
    map.getSource('lines').setData({ type: 'FeatureCollection', features: guesses.map((g) => ({
      type: 'Feature', geometry: { type: 'LineString', coordinates: [[g.lng, g.lat], [g.nearest.lng, g.nearest.lat]] } })) });
    if (!roundChanged) return; // late joiners / rebroadcasts must not yank the camera
    const b = extendBy(new maplibregl.LngLatBounds([truth.lng, truth.lat], [truth.lng, truth.lat]), tf.geometry);
    for (const g of guesses) b.extend([g.lng, g.lat]);
    // wide screens: the result panel sits on the right; phones: across the bottom
    const padding = innerWidth < 700 ? { top: 190, bottom: innerHeight * 0.5, left: 40, right: 40 } : { top: 170, bottom: 110, left: HOST ? 370 : 60, right: 380 }; // host: clear of the host bar too
    map.fitBounds(b, { padding, maxZoom: 9, duration: RM ? 0 : 1200 });
  });

  const panel = $('panel');
  panel.replaceChildren();
  myResult(panel, guesses, roundChanged);
  answerLabel(panel, truth.answer || [truth.city, truth.country].filter(Boolean).join(', '));
  const table = el('table');
  guesses.forEach((g, i) => {
    const tr = el('tr', isMe(g.playerId) ? 'me' : '');
    tr.append(el('td', null, `${i + 1}.`), el('td', null, g.name), el('td', 'n', `${g.km} km`), el('td', 'pts-c', `+${g.points}`));
    table.appendChild(tr);
  });
  for (const p of snap.players.filter((p) => !guesses.some((g) => g.playerId === p.id))) {
    const tr = el('tr', isMe(p.id) ? 'me' : '');
    tr.append(el('td', null, '–'), el('td', null, p.name), el('td', 'n', 'no pin'), el('td', 'pts-c', '+0'));
    table.appendChild(tr);
  }
  panel.appendChild(table);
  extras(panel, truth);
  panel.hidden = false;
  panel.scrollTop = 0;
}

// Reveal for typed / choice / number rounds: the right answer, everyone's answer, no globe changes.
function renderAnswerReveal(truth, guesses, roundChanged) {
  const panel = $('panel'), r = snap.round;
  panel.replaceChildren();
  myResult(panel, guesses, roundChanged);
  if (r.type === 'choice') {
    const list = el('div', 'opts-r');
    r.options.forEach((o, i) => {
      const row = el('div', 'o' + (i === truth.correct ? ' right' : ''));
      row.append(el('span', null, `${i === truth.correct ? '✓' : '·'}  ${o}`), el('span', 'c', String(guesses.filter((g) => g.answer === i).length)));
      list.appendChild(row);
    });
    panel.appendChild(list);
    if (truth.answer !== r.options[truth.correct]) answerLabel(panel, truth.answer);
  } else answerLabel(panel, truth.answer);
  const table = el('table');
  guesses.forEach((g, i) => {
    const tr = el('tr', isMe(g.playerId) ? 'me' : '');
    tr.append(el('td', null, `${i + 1}.`), el('td', null, g.name),
      el('td', 'n ' + (g.correct ? 'ok' : ''), `${answerText(g.answer)} ${g.correct ? '✓' : r.type === 'number' ? '' : '✗'}`.trim()),
      el('td', 'pts-c', `+${g.points}`));
    table.appendChild(tr);
  });
  for (const p of snap.players.filter((p) => !guesses.some((g) => g.playerId === p.id))) {
    const tr = el('tr', isMe(p.id) ? 'me' : '');
    tr.append(el('td', null, '–'), el('td', null, p.name), el('td', 'n', 'no answer'), el('td', 'pts-c', '+0'));
    table.appendChild(tr);
  }
  panel.appendChild(table);
  extras(panel, truth);
  panel.hidden = false;
  panel.scrollTop = 0;
}

function renderFinished() {
  setQ('Thanks for playing!');
  $('panel').hidden = true;
  $('action').hidden = true;
  $('answer').hidden = true;
  $('endtitle').textContent = snap.title;
  $('endsub').textContent = w().bye;
  finalBoard($('board'), snap.standings.map((s) => ({ name: s.name, total: s.total, me: isMe(s.playerId) })));
  $('endov').hidden = false;
}

function renderHost() {
  if (!HOST) return;
  $('host').hidden = false;
  $('joinlink').value = `${location.origin}/live/${code}`;
  const done = snap.players.filter((p) => p.answered).length;
  $('host').classList.toggle('all', snap.state === 'open' && done > 0 && done === snap.players.length); // cue the host to reveal
  $('count').replaceChildren();
  if (snap.state === 'open') $('count').append(el('b', null, String(done)), ` of ${snap.players.length} answered`);
  else $('count').textContent = `${snap.players.length} player${snap.players.length === 1 ? '' : 's'}`;
  $('plist').replaceChildren(...snap.players.map((p) => el('span', p.answered && snap.state === 'open' ? 'ok' : '', p.name)));
  const labels = { lobby: 'Start round 1', open: 'Reveal' };
  let label = labels[snap.state];
  if (snap.state === 'revealed') label = snap.round.ord + 1 < snap.roundCount ? `Next round (${snap.round.ord + 2}/${snap.roundCount})` : 'Show final scoreboard';
  $('next').hidden = !label;
  $('next').textContent = label || '';
  $('end').hidden = snap.state === 'finished';
}

function render() {
  if (!themed) { applyTheme(snap.theme); themed = true; }
  document.title = snap.title;
  $('gtitle').textContent = snap.title;
  const total = myTotal();
  $('tot').textContent = HOST || total == null ? '' : `${total} PTS`;
  const roundChanged = snap.state !== shown.state || (snap.round && snap.round.ord !== shown.ord);
  if (roundChanged && (snap.state === 'open' || snap.state === 'lobby' || snap.state === 'finished')) { clearGlobe(); sent = false; }
  if (roundChanged) {
    const inRound = snap.state === 'open' || snap.state === 'revealed';
    stage(map, !(inRound && isLoc())); // the globe is sharp only while a location round is played or revealed
    if (snap.state === 'open') {
      buildAnswer();
      if (snap.round.ord > 0) map.easeTo({ center: [10, 25], zoom: 1.6, duration: RM ? 0 : 1200 }); // last reveal's zoom would be a hint
    }
  }
  shown = { state: snap.state, ord: snap.round ? snap.round.ord : null };
  $('endov').hidden = snap.state !== 'finished';
  ({ lobby: renderLobby, open: renderOpen, revealed: renderReveal, finished: renderFinished })[snap.state](roundChanged);
  renderHost();
}

// ---- guessing ----
function place(lat, lng) {
  if (HOST || !snap || snap.state !== 'open' || !isLoc()) return;
  if (marker) marker.remove(); // a fresh marker replays the drop
  marker = new maplibregl.Marker({ element: pinElement(), draggable: true, anchor: 'bottom' }).setLngLat([lng, lat]).addTo(map);
  marker.on('dragend', () => { if (snap && snap.state === 'open') { sent = false; renderOpen(); } });
  sent = false;
  renderOpen();
}
map.on('click', (e) => place(e.lngLat.lat, e.lngLat.wrap().lng));

async function confirmGuess() {
  if (HOST || !snap || snap.state !== 'open' || (isLoc() ? !marker : pick == null)) return;
  const g = isLoc() ? (({ lat, lng }) => ({ lat, lng }))(marker.getLngLat().wrap()) : { answer: pick };
  $('action').hidden = true;
  const ord = snap.round.ord;
  try {
    const resp = await postJson('/guess', { token, ord, ...g });
    if (resp.status === 409) { setQ(snap.round.question, 'Round closed — waiting for the host', true); return; }
    if (!resp.ok) throw new Error(resp.status);
    if (snap && snap.state === 'open' && snap.round && snap.round.ord === ord) { sent = true; renderOpen(); }
  } catch { $('action').hidden = false; setQ(snap.round.question, 'Network hiccup — try again', true); }
}
$('action').addEventListener('click', confirmGuess);

// ---- host controls ----
$('next').addEventListener('click', async () => {
  $('next').disabled = true;
  try { await fetch(`/api/admin/sessions/${code}/next`, { method: 'POST' }); }
  finally { $('next').disabled = false; }
});
$('end').addEventListener('click', async () => {
  if (!confirm('End this session for everyone? The scoreboard shows what has been revealed so far.')) return;
  await fetch(`/api/admin/sessions/${code}/end`, { method: 'POST' });
});
$('copy').addEventListener('click', () => {
  const url = $('joinlink').value;
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => { $('copy').textContent = 'Copied'; setTimeout(() => { $('copy').textContent = 'Copy'; }, 1500); });
  else { $('joinlink').select(); document.execCommand('copy'); }
});

// ---- joining + the stream ----
function connect() {
  const es = new EventSource(`/live/api/${code}/events?token=${encodeURIComponent(token || '')}`);
  es.addEventListener('state', (e) => { snap = JSON.parse(e.data); render(); });
  es.onerror = () => { $('hint').textContent = 'Reconnecting…'; };
}
$('join').addEventListener('click', async () => {
  const name = $('pname').value.trim();
  if (!name) return $('pname').focus();
  $('nameerr').hidden = true;
  const resp = await postJson('/join', { name });
  if (resp.status === 409) { $('nameerr').textContent = 'That name is taken — pick another.'; $('nameerr').hidden = false; return; }
  if (!resp.ok) { $('nameerr').textContent = 'Could not join — try again.'; $('nameerr').hidden = false; return; }
  const p = await resp.json();
  token = p.token;
  try { localStorage.setItem(KEY, token); } catch {}
  $('nameov').hidden = true;
  connect();
});
$('pname').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('join').click(); });

window.liveState = { place, confirm: confirmGuess, render: (s) => { snap = s; render(); }, // debug/driver handle
  answer: (v) => { pick = v; sent = false; renderOpen(); } };

stage(map, true);
(async () => {
  let first;
  try {
    const resp = await api(`/state?token=${encodeURIComponent(token || '')}`);
    if (!resp.ok) throw new Error(resp.status);
    first = await resp.json();
  } catch { setQ('Could not load this session.', 'Check the link', true); return; }
  applyTheme(first.theme); themed = true;
  $('gtitle').textContent = first.title;
  $('wtitle').textContent = first.title;
  $('join').textContent = w().join;
  if (!HOST && !first.you) {
    token = null;
    setQ('Join the game');
    $('nameov').hidden = false;
    $('pname').focus();
    return;
  }
  connect();
})();
</script>
</body>
</html>
