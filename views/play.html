<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MapTap · Play</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.6.0/dist/maplibre-gl.css">
<style>
  :root {
    color-scheme: dark;
    --bg: #070b1c; --bg-2: #0a1030; --panel: rgba(16,22,52,.92); --border: rgba(130,155,255,.16);
    --text: #eaf0ff; --muted: #98a4d4; --cyan: #22d3ee; --gold: #ffd15c;
    --body: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; overflow: hidden; color: var(--text); font: 16px/1.5 var(--body);
    background: radial-gradient(1200px 800px at 50% -5%, var(--bg-2), var(--bg) 70%); }
  #map { position: fixed; inset: 0; }
  .credit { position: fixed; right: 8px; bottom: 6px; z-index: 3; color: rgba(152,164,212,.8);
    font: .7rem var(--mono); pointer-events: none; }

  .top { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 4;
    width: min(560px, calc(100vw - 24px)); background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 10px 16px; text-align: center; box-shadow: 0 6px 24px rgba(0,0,0,.45); }
  .top .t { font: .7rem var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--cyan); }
  .top .q { font: 600 1.02rem/1.4 var(--body); }
  .top .q .rno { color: var(--muted); font: .8rem var(--mono); margin-right: 8px; }
  .top .hint { font: .75rem var(--mono); color: var(--muted); }

  #action { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 5;
    font: 700 1rem var(--body); cursor: pointer; border-radius: 999px; padding: 12px 30px;
    border: 1px solid rgba(34,211,238,.5); background: rgba(11,50,64,.92); color: var(--cyan);
    box-shadow: 0 6px 24px rgba(0,0,0,.5); }
  #action:hover { background: rgba(34,211,238,.25); }
  #action[hidden] { display: none; }

  .ov { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
    background: rgba(7,11,28,.7); backdrop-filter: blur(3px); padding: 16px; }
  .ov[hidden] { display: none; }
  .ov .card { background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
    padding: 26px 28px; width: min(420px, 100%); max-height: 86vh; overflow-y: auto;
    box-shadow: 0 10px 40px rgba(0,0,0,.6); text-align: center; }
  .ov h1 { font: 1.15rem var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--cyan); margin: 0 0 8px; }
  .ov p { color: var(--muted); font-size: .9rem; margin: 0 0 16px; }
  .ov input { width: 100%; background: rgba(10,14,34,.72); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font: 1rem var(--body); padding: 10px 12px; text-align: center; margin-bottom: 14px; }
  .ov input:focus { outline: none; border-color: rgba(34,211,238,.4); }
  .ov button { font: 700 .95rem var(--body); cursor: pointer; border-radius: 999px; padding: 10px 28px;
    border: 1px solid rgba(34,211,238,.5); background: rgba(34,211,238,.15); color: var(--cyan); }
  .ov table { width: 100%; border-collapse: collapse; font-size: .92rem; text-align: left; }
  .ov td { padding: 6px 4px; border-top: 1px solid var(--border); }
  .ov td.pts { text-align: right; font-family: var(--mono); }
  .ov tr.me td { color: var(--gold); font-weight: 700; }
  .ov .total { font: 2rem var(--mono); color: var(--gold); margin: 4px 0 14px; }

  /* Typed / choice / number rounds: the answer card sits above the action button. */
  #answer { position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%); z-index: 5;
    width: min(460px, calc(100vw - 24px)); background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.5); display: flex; flex-direction: column; gap: 8px; }
  #answer[hidden] { display: none; }
  #answer .numwrap { display: flex; align-items: center; gap: 10px; }
  #answer input { flex: 1; min-width: 0; background: rgba(10,14,34,.72); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font: 1.05rem var(--body); padding: 12px; text-align: center; }
  #answer input:focus { outline: none; border-color: rgba(34,211,238,.5); }
  #answer .unit { font: .95rem var(--mono); color: var(--muted); }
  #answer .opt { text-align: left; font: 600 .98rem var(--body); padding: 12px 14px; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--border); background: rgba(10,14,34,.72); color: var(--text); }
  #answer .opt:hover { border-color: rgba(34,211,238,.4); }
  #answer .opt.sel { border-color: var(--cyan); background: rgba(34,211,238,.15); color: var(--cyan); }
  #reveal .verdict { font: 700 1rem var(--body); margin-bottom: 4px; }
  #reveal .o { font-size: .9rem; padding: 3px 0; color: var(--muted); }
  #reveal .o.right { color: var(--gold); font-weight: 700; }
  #reveal .o.mine:not(.right) { color: var(--text); text-decoration: line-through; }
  #reveal { position: fixed; top: 86px; right: 14px; z-index: 4; width: min(320px, calc(100vw - 28px));
    max-height: calc(100vh - 170px); overflow-y: auto; background: var(--panel);
    border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  #reveal[hidden] { display: none; }
  #reveal .pts { font: 2rem var(--mono); color: var(--gold); }
  #reveal .km { font: .8rem var(--mono); color: var(--muted); margin-bottom: 8px; }
  #reveal .ans { font-weight: 700; margin-bottom: 8px; }
  #reveal img { width: 100%; border-radius: 10px; border: 1px solid var(--border); display: block; margin-bottom: 4px; }
  #reveal .story { font-size: .88rem; white-space: pre-wrap; color: var(--text); }
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <div class="t" id="gtitle">MapTap</div>
  <div class="q"><span class="rno" id="rno"></span><span id="question">Loading…</span></div>
  <div class="hint" id="hint"></div>
</div>
<button id="action" hidden></button>
<div id="answer" hidden></div>
<div id="reveal" hidden></div>
<div class="ov" id="nameov" hidden><div class="card">
  <h1 id="wtitle">MapTap</h1>
  <p>Tap the globe, type, or pick your answer each round. Closer means more points. Type your name — it goes on the leaderboard.</p>
  <input id="pname" maxlength="40" placeholder="Your name" aria-label="Your name" autocomplete="off">
  <button id="start">Play</button>
</div></div>
<div class="ov" id="endov" hidden><div class="card">
  <h1 id="endtitle"></h1>
  <div class="total" id="endtotal"></div>
  <table id="board"></table>
</div></div>
<div class="credit">Imagery © Esri &amp; contributors · MapLibre</div>
<script type="module">
import * as maplibregl from 'https://cdn.jsdelivr.net/npm/maplibre-gl@6.6.0/dist/maplibre-gl.mjs';

const $ = (id) => document.getElementById(id);
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const slug = location.pathname.split('/').filter(Boolean).pop();
const api = (p, opts) => fetch(`/api/${slug}${p}`, opts);

const map = new maplibregl.Map({
  container: 'map',
  attributionControl: false, // the .credit line carries the Esri notice
  minZoom: 1, maxZoom: 17, center: [10, 25], zoom: 1.6,
  style: { version: 8,
    projection: { type: 'globe' },
    sources: { sat: { type: 'raster', tileSize: 256, maxzoom: 17,
      attribution: 'Imagery © Esri & contributors',
      tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'] } },
    layers: [{ id: 'sat', type: 'raster', source: 'sat' }],
    sky: { 'sky-color': '#02040f', 'horizon-color': '#0e5d7a', 'fog-color': '#070b1c',
      'sky-horizon-blend': 0.6, 'horizon-fog-blend': 0.6,
      'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 1, 6, 1, 8, 0.1] } },
});
window.map = map; // console/debug handle

let game = null, ord = 0, guesses = [], marker = null, phase = 'load'; // load|name|guess|reveal|done
let playerName = '';
try { playerName = localStorage.getItem('maptap:player') || ''; } catch {}

const EMPTY = { type: 'FeatureCollection', features: [] };
let ready = false; // map.loaded() is false whenever tiles are in flight and 'load' fires once, so track readiness ourselves
// The reveal geometry as a feature: the round's shape, or a point at the anchor.
const truthFeature = (t) => ({ type: 'Feature', geometry: t.geometry || { type: 'Point', coordinates: [t.lng, t.lat] } });
// Extend bounds by every position of a geometry.
const extendBy = (bounds, geometry) => {
  const walk = (c) => (typeof c[0] === 'number' ? bounds.extend(c) : c.forEach(walk));
  walk(geometry.coordinates);
  return bounds;
};
map.on('load', () => {
  map.addSource('truth', { type: 'geojson', data: EMPTY });
  map.addSource('line', { type: 'geojson', data: EMPTY });
  // A shape round renders as fill + outline, a point round as the dot — geometry-type picks per feature.
  map.addLayer({ id: 'truth-fill', type: 'fill', source: 'truth', filter: ['==', ['geometry-type'], 'Polygon'],
    paint: { 'fill-color': '#ffd15c', 'fill-opacity': 0.25 } });
  map.addLayer({ id: 'line', type: 'line', source: 'line',
    paint: { 'line-color': '#22d3ee', 'line-width': 2, 'line-dasharray': [1.5, 1.5] } });
  map.addLayer({ id: 'truth-line', type: 'line', source: 'truth', filter: ['!=', ['geometry-type'], 'Point'],
    paint: { 'line-color': '#ffd15c', 'line-width': 3 } });
  map.addLayer({ id: 'truth', type: 'circle', source: 'truth', filter: ['==', ['geometry-type'], 'Point'],
    paint: { 'circle-radius': 6, 'circle-color': '#ffd15c', 'circle-stroke-color': '#070b1c', 'circle-stroke-width': 2 } });
  ready = true;
});

function setBanner(question, hint) {
  $('rno').textContent = game ? `${ord + 1}/${game.rounds.length}` : '';
  $('question').textContent = question;
  $('hint').textContent = hint || '';
}

const round = () => game.rounds[ord];
const isLoc = () => round().type === 'location';
const HINTS = { location: 'tap the globe to drop your pin', text: 'type your answer', choice: 'pick one', number: 'your best estimate' };
const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
// "57,5" → 57.5, "9,289" / "9 289" → 9289; null if it isn't a number.
const parseNum = (raw) => {
  let v = raw.replace(/[\s'_]/g, '');
  v = /^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(v) ? v.replace(/,/g, '') : v.replace(',', '.');
  return v && Number.isFinite(Number(v)) ? Number(v) : null;
};
const fmtNum = (n) => n.toLocaleString('en', { maximumFractionDigits: 3 });
let pick = null; // the current typed / chosen / estimated answer on non-location rounds

function readyAction() {
  $('action').textContent = 'Submit answer';
  $('action').hidden = pick == null;
}
// Untrusted text (options, units) via textContent only.
function answerCard() {
  const r = round(), box = $('answer');
  box.replaceChildren();
  pick = null;
  if (r.type === 'choice') {
    r.options.forEach((o, i) => {
      const b = mk('button', 'opt', o);
      b.type = 'button';
      b.onclick = () => { pick = i; for (const x of box.children) x.classList.toggle('sel', x === b); readyAction(); };
      box.appendChild(b);
    });
  } else {
    const wrap = mk('div', 'numwrap'), inp = mk('input');
    inp.autocomplete = 'off';
    inp.placeholder = r.type === 'number' ? 'Your estimate' : 'Type your answer';
    if (r.type === 'number') inp.inputMode = 'decimal'; else inp.maxLength = 100;
    inp.setAttribute('aria-label', inp.placeholder);
    inp.oninput = () => { pick = r.type === 'number' ? parseNum(inp.value) : (inp.value.trim() || null); readyAction(); };
    inp.onkeydown = (e) => { if (e.key === 'Enter') confirmGuess(); };
    wrap.appendChild(inp);
    if (r.unit) wrap.appendChild(mk('span', 'unit', r.unit));
    box.appendChild(wrap);
    setTimeout(() => inp.focus(), 0);
  }
  box.hidden = false;
}

function startRound() {
  phase = 'guess';
  if (marker) { marker.remove(); marker = null; }
  const setEmpty = () => { map.getSource('truth').setData(EMPTY); map.getSource('line').setData(EMPTY); };
  if (ready) setEmpty(); else map.once('load', setEmpty);
  if (ord > 0) map.easeTo({ center: [10, 25], zoom: 1.6, duration: RM ? 0 : 1200 }); // last reveal's zoom would be a hint
  $('reveal').hidden = true;
  $('action').hidden = true;
  $('answer').hidden = true;
  if (!isLoc()) answerCard();
  setBanner(round().question, HINTS[round().type]);
}

function place(lat, lng) {
  if (phase !== 'guess' || !isLoc()) return;
  if (!marker) marker = new maplibregl.Marker({ draggable: true, color: '#22d3ee' }).setLngLat([lng, lat]).addTo(map);
  else marker.setLngLat([lng, lat]);
  $('action').textContent = 'Confirm guess';
  $('action').hidden = false;
  $('hint').textContent = 'drag the pin to adjust, then confirm';
}
map.on('click', (e) => place(e.lngLat.lat, e.lngLat.wrap().lng));

// Reveal card is untrusted server/user text — createElement/textContent only.
function showReveal(r, g) {
  const box = $('reveal'), t = r.truth, rd = round();
  box.replaceChildren();
  const add = (tag, cls, text) => box.appendChild(mk(tag, cls, text));
  add('div', 'pts', `+${r.points} pts`);
  let label = t.answer;
  if (rd.type === 'location') {
    add('div', 'km', `${r.km} km away`);
    label = t.answer || [t.city, t.country].filter(Boolean).join(' · ');
    if (label) add('div', 'ans', `📍 ${label}`);
  } else if (rd.type === 'choice') {
    add('div', 'verdict', r.correct ? '✓ Right' : '✗ Not quite');
    rd.options.forEach((o, i) => add('div', `o${i === t.correct ? ' right' : ''}${i === g.answer ? ' mine' : ''}`,
      `${i === t.correct ? '✓' : i === g.answer ? '✗' : '·'} ${o}`));
    if (t.answer !== rd.options[t.correct]) add('div', 'ans', t.answer);
  } else if (rd.type === 'number') {
    const u = t.unit ? ` ${t.unit}` : '';
    add('div', 'km', `you said ${fmtNum(g.answer)}${u} · off by ${fmtNum(Math.abs(g.answer - t.value))}${u}`);
    add('div', 'ans', `✔ ${t.answer}`);
  } else {
    add('div', 'verdict', r.correct ? '✓ Right' : '✗ Not quite');
    add('div', 'km', `you said “${g.answer}”`);
    add('div', 'ans', `✔ ${t.answer}`);
  }
  if (r.truth.photo) {
    const img = document.createElement('img');
    img.src = `/uploads/${r.truth.photo}`; img.alt = label || 'photo'; img.loading = 'lazy';
    box.appendChild(img);
  }
  if (r.truth.story) add('div', 'story', r.truth.story);
  box.hidden = false;
}

async function confirmGuess() {
  if (phase !== 'guess' || (isLoc() ? !marker : pick == null)) return;
  phase = 'reveal';
  $('action').hidden = true;
  const g = isLoc() ? (({ lat, lng }) => ({ lat, lng }))(marker.getLngLat().wrap()) : { answer: pick };
  let r;
  try {
    const resp = await api('/guess', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ ord: round().ord, ...g }) });
    if (!resp.ok) throw new Error(resp.status);
    r = await resp.json();
  } catch { phase = 'guess'; $('action').hidden = false; $('hint').textContent = 'network hiccup — try again'; return; }
  guesses.push({ ord: round().ord, ...g });
  $('answer').hidden = true;
  if (!isLoc()) { showReveal(r, g); return afterReveal(); }
  const { lat, lng } = g;
  const tf = truthFeature(r.truth);
  map.getSource('truth').setData(tf);
  map.getSource('line').setData({ type: 'Feature', geometry: {
    type: 'LineString', coordinates: [[lng, lat], [r.nearest.lng, r.nearest.lat]] } });
  const bounds = extendBy(new maplibregl.LngLatBounds([lng, lat], [lng, lat]), tf.geometry);
  map.fitBounds(bounds, { padding: 90, maxZoom: 9, duration: RM ? 0 : 1200 });
  showReveal(r, g);
  afterReveal();
}

function afterReveal() {
  setBanner(round().question, '');
  const last = ord === game.rounds.length - 1;
  $('action').textContent = last ? 'See results' : 'Next round';
  $('action').hidden = false;
}

function nextRound() {
  if (phase !== 'reveal') return;
  if (ord < game.rounds.length - 1) { ord += 1; startRound(); }
  else finish();
}

function showBoard(title, total, leaderboard) {
  phase = 'done';
  $('reveal').hidden = true;
  $('action').hidden = true;
  $('endtitle').textContent = title;
  $('endtotal').textContent = total == null ? '' : `${total} pts`;
  const rows = (leaderboard || []).map((p, i) => {
    const tr = document.createElement('tr');
    if (p.player_name.toLowerCase() === playerName.toLowerCase()) tr.className = 'me';
    for (const [cls, text] of [['', `${i + 1}.`], ['', p.player_name], ['pts', `${p.total} pts`]]) {
      const td = document.createElement('td');
      td.className = cls; td.textContent = text;
      tr.appendChild(td);
    }
    return tr;
  });
  $('board').replaceChildren(...rows);
  $('endov').hidden = false;
}

async function finish() {
  setBanner('Adding you to the leaderboard…', '');
  let resp;
  try {
    resp = await api('/plays', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ player_name: playerName, guesses }) });
  } catch { phase = 'reveal'; $('action').hidden = false; $('hint').textContent = 'network hiccup — try again'; return; }
  const d = await resp.json();
  if (resp.status === 409) showBoard(`${playerName}, you already played this one`, null, d.leaderboard);
  else showBoard(game.title, d.total, d.leaderboard);
}

$('action').addEventListener('click', () => (phase === 'guess' ? confirmGuess() : nextRound()));
$('start').addEventListener('click', () => {
  const name = $('pname').value.trim();
  if (!name) return $('pname').focus();
  playerName = name;
  try { localStorage.setItem('maptap:player', name); } catch {}
  $('nameov').hidden = true;
  startRound();
});
$('pname').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('start').click(); });

window.playState = { place, confirm: confirmGuess, next: nextRound, // debug/driver handle
  answer: (v) => { pick = v; readyAction(); } };

(async () => {
  try {
    const resp = await api('');
    if (!resp.ok) throw new Error(resp.status);
    game = await resp.json();
  } catch { setBanner('Could not load this game.', 'check the link'); return; }
  document.title = `MapTap · ${game.title}`;
  $('gtitle').textContent = game.title;
  $('wtitle').textContent = game.title;
  if (!game.rounds.length) { setBanner('This game has no rounds yet.', ''); return; }
  phase = 'name';
  setBanner('Ready?', '');
  $('pname').value = playerName;
  $('nameov').hidden = false;
})();
</script>
</body>
</html>
