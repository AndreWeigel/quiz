<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.6.0/dist/maplibre-gl.css">
<style>
  :root {
    color-scheme: dark;
    --bg: #070b1c; --bg-2: #0a1030; --panel: rgba(16,22,52,.9); --panel-2: rgba(10,14,34,.72); --border: rgba(130,155,255,.16);
    --text: #eaf0ff; --muted: #a3aed8; --cyan: #22d3ee; --red: #f0616a; --amber: #ffb020; --green: #4ade80; --ink: #1a1205;
    --display: "Space Grotesk", Inter, sans-serif;
    --body: Inter, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; color: var(--text);
    font: 15px/1.5 var(--body); background: radial-gradient(1200px 800px at 50% -5%, var(--bg-2), var(--bg) 70%) fixed; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px 80px; }
  .wrap.narrow { max-width: 820px; }
  h1 { font: 700 1.8rem/1.1 var(--display); letter-spacing: -.01em; margin: 32px 0 6px; }
  p.hint { color: var(--muted); font-size: .9rem; margin: 0 0 18px; }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  button { font-family: var(--mono); cursor: pointer; border-radius: 999px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); padding: 8px 16px; font-size: .88rem; min-height: 40px;
    transition: background .15s, border-color .15s, color .15s; }
  button:hover:not(:disabled) { border-color: rgba(34,211,238,.45); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--amber); border-color: var(--amber); color: var(--ink); font-weight: 700; }
  button.sm { padding: 4px 12px; font-size: .8rem; min-width: 40px; min-height: 36px; }
  button.icon { border: 0; background: none; color: var(--muted); padding: 0; min-width: 40px; min-height: 40px;
    display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; }
  button.icon:hover:not(:disabled) { color: var(--text); background: rgba(255,255,255,.05); }
  button.icon.danger:hover:not(:disabled) { color: var(--red); }
  svg { flex: none; }

  /* top bar */
  .bar { display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 8;
    margin: 0 -20px 20px; padding: 12px 20px; background: rgba(7,11,28,.82); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .bar .gt { flex: 1 1 120px; min-width: 0; font: 700 1.25rem var(--display); background: transparent; border: 1px solid transparent;
    border-radius: 10px; padding: 4px 8px; color: var(--text); }
  .bar .gt:hover { border-color: var(--border); }
  .bar .gt:focus { outline: none; border-color: rgba(34,211,238,.45); background: var(--panel-2); }
  #status { font: .8rem var(--mono); color: var(--muted); }
  #status.warn { color: var(--amber); }
  select { appearance: none; background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); padding: 8px 30px 8px 12px; font: 600 .82rem var(--mono); min-height: 40px;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: right 14px center, right 9px center; background-size: 5px 5px; background-repeat: no-repeat; }

  /* games list */
  .game { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--panel);
    border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
  .game .t { font: 700 1.05rem var(--display); flex: 1; min-width: 140px; }
  .game .meta { font: .75rem var(--mono); color: var(--muted); }
  .game .sessions { flex-basis: 100%; font: .75rem var(--mono); color: var(--muted); }
  .game .sessions a { color: var(--cyan); text-decoration: none; }
  .game .sessions .fin { opacity: .6; }
  .empty { color: var(--muted); font-style: italic; }

  /* editor: round list + the selected round */
  .editor { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 22px; align-items: start; }
  .editor > * { min-width: 0; } /* long round titles ellipsize instead of widening the page */
  .side { position: sticky; top: 84px; max-height: calc(100vh - 104px); display: flex; flex-direction: column; gap: 10px; }
  .side h2, .card h3 { font: 700 .72rem var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .side h2 { display: flex; justify-content: space-between; padding: 0 4px; }
  .rlist { list-style: none; margin: 0; padding: 2px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .ri { display: flex; align-items: center; gap: 6px; min-height: 56px; padding: 6px 6px 6px 2px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px; position: relative;
    transition: transform .18s ease, border-color .15s, background .15s; }
  .ri:hover { border-color: rgba(34,211,238,.3); }
  .ri.sel { border-color: var(--cyan); background: rgba(34,211,238,.09); }
  .ri.dragging { transition: none; z-index: 3; box-shadow: 0 12px 32px rgba(0,0,0,.55); cursor: grabbing; }
  .ri .handle { cursor: grab; touch-action: none; color: var(--muted); min-width: 30px; }
  .ri .n { font: 700 .75rem var(--mono); color: var(--cyan); width: 22px; flex: none; }
  .ri .tico { color: var(--muted); display: inline-flex; }
  .ri .qt { flex: 1; min-width: 0; font: 500 .86rem/1.3 var(--body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ri .qt.none { color: var(--muted); font-style: italic; }
  .ri .st { display: inline-flex; }
  .ri .st.ok { color: var(--green); } .ri .st.no { color: var(--amber); }
  .ri .del { opacity: 0; }
  .ri:hover .del, .ri.sel .del, .ri .del:focus-visible { opacity: 1; }
  @media (hover: none) { .ri .del { opacity: 1; } }
  .addbox { border: 1px dashed var(--border); border-radius: 12px; padding: 10px; }
  .addbox .lbl { font: .75rem var(--mono); color: var(--muted); margin: 0 0 8px 2px; }
  .addtypes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .addtypes button { border-radius: 10px; display: flex; align-items: center; gap: 8px; justify-content: flex-start; font-size: .78rem; padding: 6px 10px; }
  .addtypes button svg { color: var(--cyan); }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 20px 22px; }
  .card + .card { margin-top: 14px; }
  .card h3 { margin-bottom: 12px; }
  .rhead { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .rhead .rn { font: 700 1.1rem var(--display); }
  .rhead .sp { flex: 1; }
  .f { display: flex; flex-direction: column; gap: 5px; margin: 0 0 12px; font: 600 .78rem var(--body); color: var(--muted); min-width: 0; }
  .f:last-child { margin-bottom: 0; }
  .f small { font: .72rem var(--mono); color: var(--muted); font-weight: 400; opacity: .85; }
  input[type=text], textarea { width: 100%; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); padding: 10px 12px; font: 400 .9rem var(--body); min-height: 44px; }
  input[type=text]:focus, textarea:focus { outline: none; border-color: rgba(34,211,238,.5); }
  input:disabled { opacity: .55; }
  input.qin { font: 600 1.05rem var(--body); }
  .row { display: flex; gap: 10px; align-items: flex-end; }
  .row > .f { flex: 1; }
  .locrow { display: flex; gap: 8px; align-items: center; position: relative; margin-bottom: 12px; }
  .locrow .city { flex: 3; min-width: 0; }
  .locrow .coords { flex: 2; min-width: 0; font-family: var(--mono); font-size: .82rem; }
  .geo { display: inline-flex; } .geo.ok { color: var(--green); } .geo.no { color: var(--amber); }
  .sug { position: absolute; top: 100%; left: 0; right: 0; z-index: 6; display: flex; flex-direction: column; margin-top: 4px;
    background: var(--bg-2); border: 1px solid rgba(34,211,238,.4); border-radius: 10px; overflow: hidden; }
  .sug button { border: 0; border-radius: 0; text-align: left; font-size: .8rem; padding: 9px 12px; }
  .sug button:hover { background: rgba(34,211,238,.12); color: var(--cyan); }
  details.shape { border: 1px dashed var(--border); border-radius: 10px; padding: 8px 12px; }
  details.shape summary { cursor: pointer; font: .78rem var(--mono); color: var(--muted); min-height: 28px; display: flex; align-items: center; }
  details.shape textarea { min-height: 64px; resize: vertical; font: .75rem var(--mono); margin-top: 6px; }
  details.shape .stx { font: .75rem var(--mono); color: var(--muted); margin: 6px 0; }
  details.shape .stx.ok { color: var(--cyan); } details.shape .stx.err { color: var(--red); }
  details.shape .links { font: .75rem var(--mono); color: var(--muted); margin: 4px 0 8px; }
  details.shape .links a { color: var(--cyan); text-decoration: none; }
  .tnote { font: .74rem var(--mono); color: var(--muted); margin-top: 6px; }
  .accept { min-height: 96px; resize: vertical; }
  .opt { display: flex; gap: 8px; align-items: center; margin: 0 0 8px; }
  .opt input[type=radio] { accent-color: var(--green); width: 20px; height: 20px; flex: none; margin: 0 6px; cursor: pointer; }
  .opt.right input[type=text] { border-color: rgba(74,222,128,.5); }
  .numrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }

  /* scoring */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { border-radius: 10px; padding: 6px 12px; text-align: left; line-height: 1.25; font-size: .78rem; }
  .chips button small { display: block; color: var(--muted); font-size: .68rem; }
  .chips button.on { border-color: var(--cyan); background: rgba(34,211,238,.12); color: var(--cyan); }
  .kmin { display: inline-flex; align-items: center; gap: 6px; font: .78rem var(--mono); color: var(--muted); }
  .kmin input { width: 96px; text-align: right; font-family: var(--mono); }
  .preview { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 14px; align-items: end; }
  .preview .c { display: flex; flex-direction: column; align-items: center; gap: 4px; font: .7rem var(--mono); color: var(--muted); }
  .preview .b { width: 100%; height: 56px; background: rgba(255,255,255,.04); border-radius: 6px; display: flex; align-items: flex-end; overflow: hidden; }
  .preview .b i { display: block; width: 100%; background: linear-gradient(var(--cyan), rgba(34,211,238,.35)); border-radius: 6px 6px 0 0; transition: height .2s ease; }
  .preview .p { font-weight: 700; color: var(--text); }
  .preview .p.zero { color: var(--muted); }
  .problem { margin-top: 14px; padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255,176,32,.35);
    background: rgba(255,176,32,.08); color: var(--amber); font: .8rem var(--mono); display: flex; gap: 8px; align-items: center; }

  .phrow { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
  .phrow img { width: 120px; height: 84px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); }
  .addph { display: inline-flex; align-items: center; justify-content: center; width: 120px; height: 84px; cursor: pointer;
    border: 1px dashed var(--border); border-radius: 10px; color: var(--muted); font: .78rem var(--mono); }
  .addph.wide { width: 100%; height: 140px; }
  .lzed { position: relative; width: fit-content; max-width: 100%; margin-bottom: 12px; touch-action: none; cursor: crosshair; user-select: none; -webkit-user-select: none; }
  .lzed img { display: block; max-width: 100%; max-height: 60vh; border-radius: 10px; }
  .lz { position: absolute; border: 2px solid var(--cyan); background: rgba(34,211,238,.16); border-radius: 4px; cursor: pointer; }
  .lz.draft { border-style: dashed; pointer-events: none; }
  .lz span, .zn { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%;
    background: var(--cyan); color: var(--ink); font: 700 .7rem var(--mono); flex: none; }
  .lz span { position: absolute; top: -11px; left: -11px; }
  .addph:hover, .addph:focus-within { border-color: rgba(34,211,238,.45); color: var(--cyan); }
  .story { resize: vertical; min-height: 72px; line-height: 1.45; }
  .blank { text-align: center; padding: 48px 22px; color: var(--muted); }
  .blank .addtypes { max-width: 380px; margin: 16px auto 0; }

  @media (max-width: 860px) {
    .editor { grid-template-columns: 1fr; }
    .side { position: static; max-height: none; }
    .rlist { max-height: 46vh; }
    .locrow { flex-wrap: wrap; } .locrow .city { flex: 1 1 100%; }
    .card { padding: 16px; }
    .preview { grid-template-columns: repeat(3, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) { .ri, .preview .b i { transition: none; } }

  #mapmodal { position: fixed; inset: 0; z-index: 20; background: var(--bg); }
  #pickmap { position: absolute; inset: 0; }
  .maphint { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: var(--panel);
    border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; font: .8rem var(--mono);
    color: var(--text); pointer-events: none; white-space: nowrap; }
  #mapclose { position: absolute; top: 10px; right: 10px; z-index: 21; }
  .mapcredit { position: absolute; right: 8px; bottom: 6px; color: rgba(152,164,212,.8);
    font: .7rem var(--mono); pointer-events: none; }
</style>
</head>
<body>
<div class="wrap narrow" id="wrap">
  <div id="intro">
    <h1>Game builder</h1>
    <p class="hint">Create a game, add rounds, share the link on WhatsApp. The link is the invitation —
      anyone who has it can play.</p>
  </div>
  <div class="bar">
    <button id="new">+ New game</button>
    <button id="back" hidden>← Games</button>
    <input type="text" class="gt" id="gtitle" aria-label="Game title" maxlength="120" hidden>
    <span id="status" role="status"></span>
    <button id="save" class="primary" hidden disabled>Save</button>
  </div>
  <div id="main"></div>
</div>
<div id="mapmodal" hidden>
  <div id="pickmap"></div>
  <div class="maphint">Tap the secret spot — zoom in for precision</div>
  <button id="mapclose" aria-label="Close map">✕</button>
  <div class="mapcredit">Imagery © Esri &amp; contributors</div>
</div>
<script>
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (id) => document.getElementById(id);
let games = [];
let editing = null; // { game, rounds, sessions, dirty, sel }

const fmtCoords = (r) => Number.isFinite(r.lat) ? `${r.lat}, ${r.lng}` : '';
const fmtKm = (n) => Number(n).toLocaleString('en');
// "53.958, -1.089" or Google Maps' degrees/minutes/seconds "53°57'28.9"N 1°05'20.6"W" → [lat, lng], or null.
function parseCoords(text) {
  const s = text.trim();
  let lat, lng;
  const dec = s.match(/^(-?\d+(?:\.\d+)?)[,\s]+(-?\d+(?:\.\d+)?)$/);
  if (dec) [lat, lng] = [+dec[1], +dec[2]];
  else {
    const parts = [...s.matchAll(/(\d+(?:\.\d+)?)\s*°\s*(?:(\d+(?:\.\d+)?)\s*['′’]\s*)?(?:(\d+(?:\.\d+)?)\s*["″”]\s*)?([NSEW])/gi)];
    if (parts.length !== 2) return null;
    for (const [, d, m = 0, sec = 0, h] of parts) {
      const v = +((+d + m / 60 + sec / 3600) * (/[SW]/i.test(h) ? -1 : 1)).toFixed(6);
      if (/[NS]/i.test(h)) lat = v; else lng = v;
    }
  }
  return Number.isFinite(lat) && Number.isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180 ? [lat, lng] : null;
}
// Client-side read of pasted GeoJSON: enough to label it and place the anchor. The server re-validates.
const KINDS = { Point: 'point', MultiPoint: 'point', LineString: 'line', MultiLineString: 'line', Polygon: 'area', MultiPolygon: 'area' };
const ERR_180 = 'shapes that cross the 180° meridian are not supported';
function parseShape(text) {
  let v;
  try { v = JSON.parse(text); } catch { return { error: 'not valid JSON' }; }
  let geoms = v && v.type === 'Feature' ? [v.geometry] : v && v.type === 'FeatureCollection' ? (v.features || []).map((f) => f && f.geometry) : [v];
  geoms = geoms.filter(Boolean);
  if (!geoms.length || geoms.some((g) => typeof g.type !== 'string' || !Object.hasOwn(KINDS, g.type) || !Array.isArray(g.coordinates))) return { error: 'invalid shape' };
  if (new Set(geoms.map((g) => KINDS[g.type])).size > 1) return { error: 'paste one kind of shape (all lines, or all areas)' };
  const kind = KINDS[geoms[0].type];
  let n = 0, invalid = false, minLat = 90, maxLat = -90, minLng = 180, maxLng = -180;
  const walk = (c) => {
    if (!Array.isArray(c)) { invalid = true; return; }
    if (typeof c[0] === 'number') {
      if (typeof c[1] !== 'number') { invalid = true; return; }
      n++; minLng = Math.min(minLng, c[0]); maxLng = Math.max(maxLng, c[0]); minLat = Math.min(minLat, c[1]); maxLat = Math.max(maxLat, c[1]);
    } else c.forEach(walk);
  };
  for (const g of geoms) walk(g.coordinates);
  if (invalid || !n || ![minLat, maxLat, minLng, maxLng].every(Number.isFinite)) return { error: 'invalid shape' };
  // Merge like the server: every feature's parts into one Multi* geometry (or a single one when there is just one part).
  const parts = geoms.flatMap((g) => (g.type.startsWith('Multi') ? g.coordinates : [g.coordinates]));
  const base = kind === 'point' ? 'Point' : kind === 'line' ? 'LineString' : 'Polygon';
  const geometry = parts.length === 1 ? { type: base, coordinates: parts[0] } : { type: 'Multi' + base, coordinates: parts };
  // Lines and rings are runs of positions; a >180° jump in longitude means they cross the 180° meridian.
  const runs = kind === 'line' ? parts : kind === 'area' ? parts.flatMap((p) => (Array.isArray(p) ? p : [])) : [];
  if (runs.some((s) => Array.isArray(s) && s.some((p, i) => i > 0 && Array.isArray(p) && Array.isArray(s[i - 1]) && Math.abs(p[0] - s[i - 1][0]) > 180))) return { error: ERR_180 };
  return { geometry, label: shapeLabelOf(geometry, n), lat: +((minLat + maxLat) / 2).toFixed(5), lng: +((minLng + maxLng) / 2).toFixed(5) };
}
const shapeLabelOf = (g, n) => `${g.type}${g.type.startsWith('Multi') ? ` · ${g.coordinates.length.toLocaleString()} parts` : ''} · ${n.toLocaleString()} point${n === 1 ? '' : 's'}`;
const shapeLabel = (r) => (r.shapeLabel || (r.geometry ? shapeLabelOf(r.geometry, countPositions(r.geometry)) : ''));
function countPositions(g) { let n = 0; const walk = (c) => { if (!Array.isArray(c)) return; if (typeof c[0] === 'number') n++; else c.forEach(walk); }; walk(g.coordinates); return n; }
const setStatus = (t, warn = false) => { $('status').textContent = t; $('status').classList.toggle('warn', warn); };

// Question types (server: src/types.js).
const TYPE_LABELS = { location: 'Location', text: 'Typed answer', choice: 'Multiple choice', number: 'Number', label: 'Label the image' };
const THEMES = { gameshow: 'Game show', railway: 'Railway' };
const svg = (d, w = 2) => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  map: svg('<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/>'),
  ok: svg('<path d="M5 12l5 5L20 7"/>', 2.5),
  warn: svg('<path d="M12 3l10 18H2zM12 10v5M12 18h.01"/>'),
  grip: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',
  trash: svg('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'),
  x: svg('<path d="M6 6l12 12M18 6L6 18"/>'),
  location: svg('<path d="M12 21s-7-6.2-7-11a7 7 0 1114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>'),
  text: svg('<path d="M4 7V5h16v2M12 5v14M9 19h6"/>'),
  choice: svg('<path d="M10 6h10M10 12h10M10 18h10"/><circle cx="5" cy="6" r="1.5"/><circle cx="5" cy="12" r="1.5"/><circle cx="5" cy="18" r="1.5"/>'),
  number: svg('<path d="M5 9h14M5 15h14M10 4L8 20M16 4l-2 16"/>'),
  label: svg('<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/>'),
};
const Q_HINT = { location: 'e.g. Where was Daniel born?', text: 'e.g. Which tunnel is the longest in the world?',
  choice: 'e.g. Which station has the most platforms?', number: 'e.g. How long is the Gotthard Base Tunnel?',
  label: 'e.g. Name the parts of the pantograph' };
const NEW_SPEC = { text: () => ({ accept: [] }), choice: () => ({ options: ['', ''], correct: 0 }), number: () => ({}), label: () => ({ zones: [] }) };
const typeOf = (r) => r.type || 'location';
const defaultHalve = (v) => (Number.isFinite(v) ? +Math.max(Math.abs(v) / 10, 1).toPrecision(3) : '');
// Anything typed into the type-specific fields, i.e. what switching type would throw away.
const typeFilled = (r) => Number.isFinite(r.lat) || !!r.geometry
  || (r.spec != null && JSON.stringify(r.spec) !== JSON.stringify(NEW_SPEC[typeOf(r)]?.()));

// Location scoring — mirror of points() in src/scoring.js, for the builder's preview only.
const locPoints = (km, radius = 25, maxkm) => (km <= radius ? 100
  : maxkm != null ? (km >= maxkm ? 0 : Math.round(100 * (maxkm - km) / (maxkm - radius)))
  : Math.round(100 * Math.exp(-(km - radius) / 500)));
const FALLOFF = [
  { v: null, label: 'Steep', sub: 'default' },
  { v: 1000, label: 'Region', sub: '0 pts past 1,000 km' },
  { v: 3000, label: 'Neighbours', sub: '0 pts past 3,000 km' },
  { v: 6000, label: 'Continent', sub: '0 pts past 6,000 km' },
];
const PREVIEW_KM = [100, 500, 1000, 2500, 5000, 10000];

// What still keeps a round from saving ('' = ready).
function problem(r) {
  if (!r.question.trim()) return 'needs a question';
  const s = r.spec || {};
  switch (typeOf(r)) {
    case 'text': return s.accept && s.accept.length ? '' : 'needs at least one accepted answer';
    case 'choice': return s.options.length >= 2 && s.options.every((o) => o.trim()) ? '' : 'needs 2–6 filled-in options';
    case 'label': {
      const zs = s.zones || [];
      if (!s.image) return 'needs a picture';
      if (zs.length < 2) return 'needs at least 2 marked spots — drag on the picture';
      if (zs.some((z) => !(z.label || '').trim())) return 'has a spot without a name';
      return new Set(zs.map((z) => z.label.trim().toLowerCase())).size === zs.length ? '' : 'has two spots with the same name';
    }
    case 'number':
      if (!Number.isFinite(s.value)) return 'needs a number as its answer';
      return ['tolerance', 'halve'].every((k) => s[k] == null || (Number.isFinite(s[k]) && (k === 'halve' ? s[k] > 0 : s[k] >= 0))) ? '' : 'has a margin that is not a number';
    default:
      if (r.shapeErr) return 'has a shape error — fix or clear the shape';
      if (!(Number.isFinite(r.lat) || r.geometry)) return 'needs a location';
      if (r.maxkm != null && !(r.maxkm > (r.radius ?? 25))) return '“no points beyond” must be more than the full-points radius';
      return '';
  }
}

function typeFields(r, i) {
  const s = r.spec || {};
  if (typeOf(r) === 'text') return `
    <label class="f">Accepted answers <small>one per line</small>
      <textarea class="accept" data-accept="${i}" placeholder="Gotthard Base Tunnel&#10;Gotthard">${esc((s.accept || []).join('\n'))}</textarea></label>
    <div class="tnote">Case, accents, punctuation and small typos are forgiven. Answers with digits must match exactly.</div>`;
  if (typeOf(r) === 'label') {
    const zs = s.zones || [], pct = (v) => `${(v * 100).toFixed(2)}%`;
    if (!s.image) return `<div class="f">Picture <small>players drag the names onto the spots you mark on it</small></div>
      <label class="addph wide">+ picture<input type="file" accept="image/*" data-limg="${i}" hidden></label>`;
    return `<div class="f">Picture <small>drag on it to mark a spot (up to 12), then name each spot below</small></div>
      <div class="lzed" id="lzed"><img src="/uploads/${esc(s.image)}" alt="" draggable="false">
        ${zs.map((z, j) => `<div class="lz" data-lz="${j}" style="left:${pct(z.x)};top:${pct(z.y)};width:${pct(z.w)};height:${pct(z.h)}"><span>${j + 1}</span></div>`).join('')}</div>
      <div class="zl">${zs.map((z, j) => `
        <div class="opt"><span class="zn">${j + 1}</span>
          <input type="text" data-zlabel="${i}:${j}" value="${esc(z.label || '')}" placeholder="Name of spot ${j + 1}" maxlength="40" aria-label="Name of spot ${j + 1}">
          <button class="icon danger" data-zdel="${i}:${j}" aria-label="Remove spot ${j + 1}">${ICON.x}</button></div>`).join('')}</div>
      <div class="tnote">Players get the names shuffled. Points = share of names put on the right spot.</div>
      <button class="sm" data-limgclear="${i}">Change picture</button>`;
  }
  if (typeOf(r) === 'choice') {
    const opts = s.options || [];
    return `<div class="f">Options <small>tick the right one — right = 100 pts, wrong = 0</small></div>
      ${opts.map((o, j) => `
      <div class="opt ${s.correct === j ? 'right' : ''}">
        <input type="radio" name="correct${i}" data-correct="${i}:${j}" ${s.correct === j ? 'checked' : ''} aria-label="Mark option ${j + 1} correct">
        <input type="text" data-opt="${i}:${j}" value="${esc(o)}" placeholder="Option ${j + 1}" aria-label="Option ${j + 1}">
        <button class="icon danger" data-delopt="${i}:${j}" ${opts.length <= 2 ? 'disabled' : ''} aria-label="Remove option ${j + 1}">${ICON.x}</button>
      </div>`).join('')}
      ${opts.length < 6 ? `<button class="sm" data-addopt="${i}">+ option</button>` : ''}`;
  }
  const num = (k, label, ph, extra = '') => `<label class="f">${label}<input type="text" inputmode="decimal" data-num="${i}:${k}"
    value="${esc(s[k] ?? '')}" placeholder="${esc(ph)}" ${extra}></label>`;
  return `<div class="numrow">
      ${num('value', 'Answer', 'e.g. 57')}
      <label class="f">Unit <small>optional</small><input type="text" data-num="${i}:unit" value="${esc(s.unit ?? '')}" placeholder="e.g. km" maxlength="20"></label>
      ${num('tolerance', 'Full points within ±', '0')}
      ${num('halve', 'Points halve every ±', defaultHalve(s.value) || '10 % of answer', 'title="Leave empty for 10 % of the answer; set it for years (e.g. 10)"')}
    </div>`;
}

function locationFields(r, i) {
  return `<div class="f">Where is it?</div>
    <div class="locrow">
      <input type="text" class="city" data-city="${i}" placeholder="City — type, then pick from the list" aria-label="City"
        value="${esc([r.city, r.country].filter(Boolean).join(', '))}" ${r.geometry ? 'disabled' : ''}>
      <input type="text" class="coords" data-coords="${i}" placeholder="or coordinates — paste from Google Maps" aria-label="Coordinates (lat, lng)" value="${esc(fmtCoords(r))}" ${r.geometry ? 'disabled title="Anchor set from the shape"' : ''}>
      <button class="sm" data-mappick="${i}" title="${r.geometry ? 'Preview the shape on a map' : 'Pick the spot on a map'}" aria-label="Open the map">${ICON.map}</button>
      ${Number.isFinite(r.lat) ? `<span class="geo ok" title="Location set">${ICON.ok}</span>` : `<span class="geo no" title="No location yet">${ICON.warn}</span>`}
    </div>
    <details class="shape" ${r.geometry ? 'open' : ''}>
      <summary>Shape (line or area) — optional${r.geometry ? ` · ${esc(shapeLabel(r))}` : ''}</summary>
      <textarea data-shape="${i}" aria-label="Shape GeoJSON" placeholder='Paste GeoJSON here — a line or an area, e.g. {"type":"LineString","coordinates":[[lng,lat],[lng,lat]]}'>${esc(r.shapeText ?? (r.geometry ? JSON.stringify(r.geometry) : ''))}</textarea>
      <div class="stx ${r.shapeErr ? 'err' : r.geometry ? 'ok' : ''}">${esc(r.shapeErr || (r.geometry ? shapeLabel(r) + ' · anchor set to its centre' : 'No shape — this round is a point'))}</div>
      <div class="links">Draw one at <a href="https://geojson.io" target="_blank" rel="noopener">geojson.io</a> ·
        export from OpenStreetMap at <a href="https://overpass-turbo.eu" target="_blank" rel="noopener">overpass-turbo.eu</a> ·
        simplify big files at <a href="https://mapshaper.org" target="_blank" rel="noopener">mapshaper.org</a></div>
      ${r.geometry ? `<button class="sm" data-mappick="${i}">Preview</button> <button class="sm" data-shapeclear="${i}">Clear shape</button>` : ''}
    </details>`;
}

const previewHTML = (r) => PREVIEW_KM.map((km) => {
  const p = locPoints(km, r.radius ?? 25, r.maxkm ?? undefined);
  return `<div class="c"><span class="p ${p ? '' : 'zero'}">${p}</span><span class="b"><i style="height:${p}%"></i></span>${fmtKm(km)} km</div>`;
}).join('');
function scoringFields(r, i) {
  const custom = r.maxkm != null && !FALLOFF.some((f) => f.v === r.maxkm);
  return `<div class="card"><h3>Scoring</h3>
    <div class="row">
      <label class="f" style="flex:0 0 auto">Full points within
        <span class="kmin"><input type="text" inputmode="decimal" data-radius="${i}" value="${esc(r.radius ?? '')}" placeholder="25" aria-label="Full points within, km"> km</span></label>
    </div>
    <div class="f">How fast points drop off further away</div>
    <div class="chips" role="group" aria-label="Point drop-off">
      ${FALLOFF.map((f) => `<button type="button" data-preset="${i}:${f.v ?? ''}" class="${(r.maxkm ?? null) === f.v ? 'on' : ''}" aria-pressed="${(r.maxkm ?? null) === f.v}">${f.label}<small>${f.sub}</small></button>`).join('')}
      <span class="kmin">or 0 pts past <input type="text" inputmode="decimal" data-maxkm="${i}" value="${custom ? esc(r.maxkm) : ''}" placeholder="km" aria-label="No points beyond, km"> km</span>
    </div>
    <div class="preview" id="preview" aria-label="Points a guess gets, by distance">${previewHTML(r)}</div>
  </div>`;
}

const sideItem = (r, i) => {
  const p = problem(r);
  return `<li class="ri ${i === editing.sel ? 'sel' : ''}" data-sel="${i}" data-i="${i}">
    <button class="icon handle" data-handle="${i}" aria-label="Move round ${i + 1} — drag, or use the arrow keys">${ICON.grip}</button>
    <span class="n">${i + 1}</span>
    <span class="tico" title="${TYPE_LABELS[typeOf(r)]}">${ICON[typeOf(r)]}</span>
    <span class="qt ${r.question.trim() ? '' : 'none'}">${esc(r.question.trim() || 'Untitled round')}</span>
    <span class="st ${p ? 'no' : 'ok'}" title="${esc(p ? 'Round ' + p : 'Ready')}">${p ? ICON.warn : ICON.ok}</span>
    <button class="icon danger del" data-delround="${i}" aria-label="Delete round ${i + 1}">${ICON.trash}</button>
  </li>`;
};
const addTypes = () => `<div class="addtypes">${Object.entries(TYPE_LABELS).map(([t, l]) =>
  `<button data-add="${t}">${ICON[t]}${l}</button>`).join('')}</div>`;
const renderSide = () => { $('rlist').innerHTML = editing.rounds.map(sideItem).join(''); $('rcount').textContent = editing.rounds.length; };

function render() {
  $('back').hidden = $('save').hidden = $('gtitle').hidden = !editing;
  $('new').hidden = $('intro').hidden = !!editing;
  $('wrap').classList.toggle('narrow', !editing);
  if (!editing) { renderList(); return; }
  $('save').disabled = !editing.dirty;
  if ($('gtitle') !== document.activeElement) $('gtitle').value = editing.game.title;
  setStatus(editing.dirty ? 'Unsaved changes' : '');
  renderEditor();
}
// A field edit that changes nothing else on screen: no full re-render, so focus and Tab order survive.
function touched() {
  editing.dirty = true;
  $('save').disabled = false;
  setStatus('Unsaved changes');
  renderSide();
}

function renderList() {
  setStatus('');
  $('main').innerHTML = games.length ? games.map((g) => `
    <div class="game">
      <span class="t">${esc(g.title)}</span>
      <span class="meta">${g.rounds} rounds · ${g.plays} plays · ${esc(THEMES[g.theme] || '')} · ${g.created_at.slice(0, 10)}</span>
      <button class="sm" data-copy="${esc(g.slug)}">Copy link</button>
      <button class="sm" data-live="${g.id}" ${g.rounds ? '' : 'disabled title="Add rounds first"'}>Go live</button>
      <button class="sm" data-edit="${g.id}">Edit</button>
      <button class="icon danger" data-del="${g.id}" aria-label="Delete game">${ICON.trash}</button>
      ${(g.sessions || []).length ? `<div class="sessions">${g.sessions.map((s) => `
        <span class="${s.state === 'finished' ? 'fin' : ''}">${s.state === 'finished' ? 'finished' : 'LIVE · ' + esc(s.state)} ·
        ${s.players} player${s.players === 1 ? '' : 's'} · ${esc(s.created_at.slice(0, 10))} ·
        <a href="/host/${esc(s.code)}" target="_blank" rel="noopener">host page</a></span>`).join('<br>')}</div>` : ''}
    </div>`).join('')
    : '<p class="empty">No games yet — press “+ New game”.</p>';
}

function renderEditor() {
  const { game, rounds } = editing;
  editing.sel = Math.min(Math.max(editing.sel ?? 0, 0), rounds.length - 1);
  const i = editing.sel, r = rounds[i];
  const p = r ? problem(r) : '';
  $('main').innerHTML = `<div class="editor">
    <aside class="side">
      <h2><span>Rounds</span><span id="rcount"></span></h2>
      <ol class="rlist" id="rlist" aria-label="Rounds"></ol>
      <div class="addbox"><div class="lbl">+ Add a round</div>${addTypes()}</div>
      <div class="card" style="padding:14px 16px">
        <label class="f">Theme <select id="theme">${Object.entries(THEMES).map(([v, l]) =>
          `<option value="${v}" ${(game.theme || 'gameshow') === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        <div class="f">Share link <small style="overflow-wrap:anywhere">${esc(location.origin)}/${esc(game.slug)}</small></div>
        <button class="sm" data-copy="${esc(game.slug)}">Copy link</button>
      </div>
    </aside>
    <section id="ed">${!r ? `<div class="card blank"><h3>No rounds yet</h3><p>Pick a question type to add the first round.</p>${addTypes()}</div>` : `
      <div class="card">
        <div class="rhead">
          <span class="rn">Round ${i + 1}<span style="color:var(--muted);font-weight:500"> / ${rounds.length}</span></span>
          <span class="sp"></span>
          <select data-type="${i}" aria-label="Question type">${Object.entries(TYPE_LABELS).map(([v, l]) =>
            `<option value="${v}" ${typeOf(r) === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
          <button class="icon danger" data-delround="${i}" aria-label="Delete this round">${ICON.trash}</button>
        </div>
        <label class="f">Question<input type="text" class="qin" data-q="${i}" placeholder="${esc(Q_HINT[typeOf(r)])}" value="${esc(r.question)}"></label>
        <div class="f">Image with the question <small>optional — players see it while answering, e.g. “What is this part called?”</small></div>
        <div class="phrow">
          ${r.qphoto ? `<img src="/uploads/${esc(r.qphoto)}" alt=""><button class="icon danger" data-delqphoto="${i}" aria-label="Remove question image">${ICON.trash}</button>`
                     : `<label class="addph">+ image<input type="file" accept="image/*" data-qphoto="${i}" hidden></label>`}
        </div>
        ${typeOf(r) === 'location' ? locationFields(r, i) : typeFields(r, i)}
      </div>
      ${typeOf(r) === 'location' ? scoringFields(r, i) : ''}
      <div class="card"><h3>The reveal</h3>
        <label class="f">Answer label <small>optional — ${typeOf(r) === 'location' ? 'e.g. Tanggula, Qinghai–Tibet Railway, China' : 'defaults to the right answer'}</small>
          <input type="text" data-answer="${i}" value="${esc(r.answer || '')}"></label>
        <div class="f">Reveal photo <small>optional — only shown after the answer</small></div>
        <div class="phrow">
          ${r.photo ? `<img src="/uploads/${esc(r.photo)}" alt=""><button class="icon danger" data-delphoto="${i}" aria-label="Remove photo">${ICON.trash}</button>`
                    : `<label class="addph">+ photo<input type="file" accept="image/*" data-photo="${i}" hidden></label>`}
        </div>
        <label class="f">Story <small>shown after everyone guesses</small>
          <textarea class="story" data-story="${i}">${esc(r.story || '')}</textarea></label>
        ${p ? `<div class="problem" id="problem">${ICON.warn}<span>This round ${esc(p)}.</span></div>` : ''}
      </div>`}
    </section></div>`;
  renderSide();
}
// The "still needed" note under the selected round, kept current without a re-render.
function refreshProblem() {
  const r = editing.rounds[editing.sel], p = r ? problem(r) : '', box = $('problem');
  if (box) { box.hidden = !p; box.querySelector('span').textContent = `This round ${p}.`; }
}

async function loadList() {
  games = (await (await fetch('/api/admin/games')).json()).games;
  await Promise.all(games.map(async (g) => {
    g.sessions = (await (await fetch(`/api/admin/games/${g.id}/sessions`)).json()).sessions;
  }));
  editing = null;
  render();
}

async function openEditor(id) {
  const d = await (await fetch(`/api/admin/games/${id}`)).json();
  const { sessions } = await (await fetch(`/api/admin/games/${id}/sessions`)).json();
  editing = { game: d.game, rounds: d.rounds, sessions, dirty: false, sel: 0 };
  render();
}

function copyLink(slug) {
  const url = `${location.origin}/${slug}`;
  // clipboard API needs https; on plain http fall back to a copyable prompt
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => setStatus('Link copied'));
  else prompt('Copy the link:', url);
}

// Full-screen click-to-pick map. MapLibre loads lazily on first open (~1MB —
// only game builders pay for it, and only if they use the map).
let pickmap = null, pickIdx = null, maplibregl = null, pickReady = false;
// Draw the current round's shape on the picker (or clear it) and frame it.
function showShape() {
  if (!pickReady) return;
  const r = editing && editing.rounds[pickIdx];
  const g = r && r.geometry;
  pickmap.getSource('shape').setData(g ? { type: 'Feature', geometry: g } : { type: 'FeatureCollection', features: [] });
  document.querySelector('.maphint').textContent = g ? 'Previewing the shape — clear it on the card to pick a point' : 'Tap the secret spot — zoom in for precision';
  if (!g) return;
  const b = new maplibregl.LngLatBounds();
  const walk = (c) => (typeof c[0] === 'number' ? b.extend(c) : c.forEach(walk));
  walk(g.coordinates);
  pickmap.fitBounds(b, { padding: 60, maxZoom: 9, duration: 0 });
}
async function openMapPicker(i) {
  pickIdx = i;
  $('mapmodal').hidden = false;
  if (!pickmap) {
    maplibregl = await import('https://cdn.jsdelivr.net/npm/maplibre-gl@6.6.0/dist/maplibre-gl.mjs');
    pickmap = new maplibregl.Map({
      container: 'pickmap',
      attributionControl: false, // .mapcredit carries the Esri notice
      minZoom: 1, maxZoom: 17, center: [10, 35], zoom: 1.5,
      style: { version: 8,
        sources: { sat: { type: 'raster', tileSize: 256, maxzoom: 17,
          tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'] } },
        layers: [{ id: 'sat', type: 'raster', source: 'sat' }] },
    });
    window.pickmap = pickmap; // console/debug handle (screenshot driver uses it)
    pickmap.on('load', () => {
      pickmap.addSource('shape', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      pickmap.addLayer({ id: 'shape-fill', type: 'fill', source: 'shape', filter: ['==', ['geometry-type'], 'Polygon'],
        paint: { 'fill-color': '#ffd15c', 'fill-opacity': 0.25 } });
      pickmap.addLayer({ id: 'shape-line', type: 'line', source: 'shape', filter: ['!=', ['geometry-type'], 'Point'],
        paint: { 'line-color': '#ffd15c', 'line-width': 3 } });
      pickmap.addLayer({ id: 'shape-pt', type: 'circle', source: 'shape', filter: ['==', ['geometry-type'], 'Point'],
        paint: { 'circle-radius': 6, 'circle-color': '#ffd15c', 'circle-stroke-color': '#070b1c', 'circle-stroke-width': 2 } });
      pickReady = true; showShape();
    });
    pickmap.on('click', async (e) => {
      if (editing && editing.rounds[pickIdx] && editing.rounds[pickIdx].geometry) return;
      const r = editing && editing.rounds[pickIdx];
      if (!r) return;
      r.lat = +e.lngLat.lat.toFixed(5);
      r.lng = +e.lngLat.wrap().lng.toFixed(5);
      delete r.city; delete r.country;
      editing.dirty = true;
      $('mapmodal').hidden = true;
      render();
      try { // best-effort city label for the reveal; the coords are already set
        const resp = await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2'
          + `&accept-language=en&zoom=10&lat=${r.lat}&lon=${r.lng}`);
        const a = (await resp.json()).address || {};
        const city = a.city || a.town || a.village || a.hamlet || a.municipality || a.county;
        if (city) { r.city = city; if (a.country) r.country = a.country; render(); }
      } catch {}
    });
  }
  const r = editing.rounds[i];
  if (Number.isFinite(r.lat)) pickmap.jumpTo({ center: [r.lng, r.lat], zoom: 8 });
  pickmap.resize(); // the container was display:none when the map last measured itself
  showShape();
}
$('mapclose').addEventListener('click', () => { $('mapmodal').hidden = true; });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('mapmodal').hidden = true; });

// ---- rounds: select, add, delete, reorder ----
const main = $('main');
function select(i) {
  editing.sel = i;
  render();
  if (matchMedia('(max-width: 860px)').matches) $('ed').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function addRound(type) {
  editing.rounds.push(type === 'location' ? { question: '', type, lat: NaN, lng: NaN } : { question: '', type, spec: NEW_SPEC[type]() });
  editing.dirty = true;
  select(editing.rounds.length - 1);
  document.querySelector('[data-q]').focus();
}
function moveRound(from, to) {
  const rs = editing.rounds;
  if (from === to || to < 0 || to >= rs.length) return;
  const sel = rs[editing.sel];
  rs.splice(to, 0, rs.splice(from, 1)[0]);
  editing.sel = rs.indexOf(sel); // the open round stays open
  editing.dirty = true;
  render();
}
// Drag by the grip: pointer events, so mouse, pen and touch all work. The list itself
// still scrolls with a finger; only the grip has touch-action: none.
// ponytail: no auto-scroll while dragging — with a list taller than the screen, drag in steps or use the arrow keys.
main.addEventListener('pointerdown', (e) => {
  const h = e.target.closest('[data-handle]');
  if (!h || !editing || e.button > 0) return;
  e.preventDefault();
  const item = h.closest('.ri'), from = +h.dataset.handle;
  const items = [...$('rlist').children], rects = items.map((x) => x.getBoundingClientRect());
  const step = rects.length > 1 ? rects[1].top - rects[0].top : rects[0].height;
  const startY = e.clientY, mid = rects[from].top + rects[from].height / 2;
  let to = from;
  h.setPointerCapture(e.pointerId);
  item.classList.add('dragging');
  const move = (ev) => {
    const dy = ev.clientY - startY;
    item.style.transform = `translateY(${dy}px)`;
    to = rects.filter((r, k) => k !== from && r.top + r.height / 2 < mid + dy).length;
    items.forEach((x, k) => {
      if (k === from) return;
      const shift = from < to && k > from && k <= to ? -step : to < from && k >= to && k < from ? step : 0;
      x.style.transform = shift ? `translateY(${shift}px)` : '';
    });
  };
  const up = () => {
    h.removeEventListener('pointermove', move);
    h.removeEventListener('pointerup', up);
    h.removeEventListener('pointercancel', up);
    items.forEach((x) => { x.style.transform = ''; });
    item.classList.remove('dragging');
    if (to !== from) moveRound(from, to);
  };
  h.addEventListener('pointermove', move);
  h.addEventListener('pointerup', up);
  h.addEventListener('pointercancel', up);
});
// Label rounds: drag on the picture to mark a spot; tap a spot to jump to its name.
main.addEventListener('pointerdown', (e) => {
  const ed = e.target.closest('#lzed');
  if (!ed || !editing || e.button > 0) return;
  const r = editing.rounds[editing.sel], lz = e.target.closest('[data-lz]');
  if (lz) return document.querySelector(`[data-zlabel="${editing.sel}:${lz.dataset.lz}"]`)?.focus();
  e.preventDefault();
  if (r.spec.zones.length >= 12) return setStatus('12 spots is the most a picture can have', true);
  const R = ed.getBoundingClientRect(), clamp = (v) => Math.min(Math.max(v, 0), 1);
  const fx = (x) => clamp((x - R.left) / R.width), fy = (y) => clamp((y - R.top) / R.height);
  const x0 = fx(e.clientX), y0 = fy(e.clientY), draft = ed.appendChild(document.createElement('div'));
  draft.className = 'lz draft';
  let z = null;
  ed.setPointerCapture(e.pointerId);
  const move = (ev) => {
    const x1 = fx(ev.clientX), y1 = fy(ev.clientY);
    z = { x: Math.min(x0, x1), y: Math.min(y0, y1), w: Math.abs(x1 - x0), h: Math.abs(y1 - y0) };
    Object.assign(draft.style, { left: `${z.x * 100}%`, top: `${z.y * 100}%`, width: `${z.w * 100}%`, height: `${z.h * 100}%` });
  };
  const up = () => {
    ed.removeEventListener('pointermove', move); ed.removeEventListener('pointerup', up); ed.removeEventListener('pointercancel', up);
    draft.remove();
    if (!z || z.w < 0.02 || z.h < 0.02) return; // a tap, not a box
    const f = (v) => +v.toFixed(4);
    r.spec.zones.push({ label: '', x: f(z.x), y: f(z.y), w: f(z.w), h: f(z.h) });
    editing.dirty = true; render();
    document.querySelector(`[data-zlabel="${editing.sel}:${r.spec.zones.length - 1}"]`)?.focus();
  };
  ed.addEventListener('pointermove', move); ed.addEventListener('pointerup', up); ed.addEventListener('pointercancel', up);
});
main.addEventListener('keydown', (e) => {
  const h = e.target.closest('[data-handle]');
  if (!h || !['ArrowUp', 'ArrowDown'].includes(e.key)) return;
  e.preventDefault();
  const from = +h.dataset.handle, to = from + (e.key === 'ArrowUp' ? -1 : 1);
  moveRound(from, to);
  document.querySelector(`[data-handle="${Math.min(Math.max(to, 0), editing.rounds.length - 1)}"]`)?.focus();
});

main.addEventListener('click', async (e) => {
  const btn = (a) => e.target.closest(`[data-${a}]`)?.dataset[a];
  const copy = btn('copy');
  if (copy) return copyLink(copy);
  const edit = btn('edit');
  if (edit) return openEditor(edit);
  const live = btn('live');
  if (live) {
    const resp = await fetch(`/api/admin/games/${live}/sessions`, { method: 'POST' });
    if (!resp.ok) return setStatus('Could not start a session', true);
    const { code } = await resp.json();
    window.open(`/host/${code}`, '_blank', 'noopener');
    return loadList();
  }
  const del = btn('del');
  if (del) {
    const g = games.find((x) => x.id === +del);
    if (!confirm(`Delete "${g.title}" and all its rounds and plays? This cannot be undone.`)) return;
    await fetch(`/api/admin/games/${del}`, { method: 'DELETE' });
    return loadList();
  }
  if (!editing) return;
  const add = btn('add');
  if (add) return addRound(add);
  const delround = btn('delround');
  if (delround !== undefined) {
    const r = editing.rounds[+delround];
    if (r.question.trim() && !confirm(`Delete round ${+delround + 1} “${r.question.trim()}”?`)) return;
    editing.rounds.splice(+delround, 1);
    if (editing.sel > +delround) editing.sel -= 1;
    editing.dirty = true; return render();
  }
  if (btn('handle') !== undefined) return;
  const sel = btn('sel');
  if (sel !== undefined) return select(+sel);
  const mappick = btn('mappick');
  if (mappick !== undefined) return openMapPicker(+mappick);
  const delphoto = btn('delphoto');
  if (delphoto !== undefined) { delete editing.rounds[+delphoto].photo; editing.dirty = true; return render(); }
  const zdel = btn('zdel');
  if (zdel !== undefined) { const [i, j] = zdel.split(':').map(Number); editing.rounds[i].spec.zones.splice(j, 1); editing.dirty = true; return render(); }
  const limgclear = btn('limgclear');
  if (limgclear !== undefined) { delete editing.rounds[+limgclear].spec.image; editing.dirty = true; return render(); } // spots stay, for a similar picture
  const delqphoto = btn('delqphoto');
  if (delqphoto !== undefined) { delete editing.rounds[+delqphoto].qphoto; editing.dirty = true; return render(); }
  const preset = btn('preset');
  if (preset !== undefined) {
    const [i, v] = preset.split(':'), r = editing.rounds[+i];
    if (v) r.maxkm = +v; else delete r.maxkm;
    editing.dirty = true; return render();
  }
  const addopt = btn('addopt');
  if (addopt !== undefined) { editing.rounds[+addopt].spec.options.push(''); editing.dirty = true; return render(); }
  const delopt = btn('delopt');
  if (delopt !== undefined) {
    const [i, j] = delopt.split(':').map(Number), s = editing.rounds[i].spec;
    s.options.splice(j, 1);
    if (s.correct === j) s.correct = 0; else if (s.correct > j) s.correct -= 1;
    editing.dirty = true; return render();
  }
  const shapeclear = btn('shapeclear');
  if (shapeclear !== undefined) {
    const r = editing.rounds[+shapeclear];
    delete r.geometry; delete r.shapeText; delete r.shapeLabel; delete r.shapeErr;
    editing.dirty = true; return render();
  }
});

// Typing: plain fields update state + the round list live, never re-rendering the card.
main.addEventListener('input', (e) => {
  if (!editing) return;
  const t = e.target, d = t.dataset;
  const r = editing.rounds[editing.sel];
  if (d.q !== undefined) r.question = t.value;
  else if (d.story !== undefined) r.story = t.value;
  else if (d.answer !== undefined) { if (t.value.trim()) r.answer = t.value; else delete r.answer; }
  else if (d.accept !== undefined) r.spec = { accept: t.value.split('\n').map((x) => x.trim()).filter(Boolean) };
  else if (d.opt !== undefined) r.spec.options[+d.opt.split(':')[1]] = t.value;
  else if (d.zlabel !== undefined) r.spec.zones[+d.zlabel.split(':')[1]].label = t.value;
  else if (d.num !== undefined) {
    const s = r.spec, k = d.num.split(':')[1], raw = t.value.trim();
    if (k === 'unit') { if (raw) s.unit = raw; else delete s.unit; }
    else if (raw === '') delete s[k];
    else s[k] = Number(raw.replace(/[\s_']/g, '')); // NaN stays visible as a save problem
    if (k === 'value') document.querySelector(`[data-num="${editing.sel}:halve"]`).placeholder = defaultHalve(s.value) || '10 % of answer';
  } else if (d.radius !== undefined || d.maxkm !== undefined) {
    const v = parseFloat(t.value), key = d.radius !== undefined ? 'radius' : 'maxkm';
    if (Number.isFinite(v) && v > 0) r[key] = v; else delete r[key];
    $('preview').innerHTML = previewHTML(r);
    document.querySelectorAll('[data-preset]').forEach((b) => {
      const on = (r.maxkm ?? null) === (b.dataset.preset.split(':')[1] ? +b.dataset.preset.split(':')[1] : null);
      b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
    });
  } else return;
  touched();
  refreshProblem();
});
$('gtitle').addEventListener('input', (e) => {
  if (!editing) return;
  const t = e.target.value.trim();
  if (t) { editing.game.title = t; touched(); }
});

main.addEventListener('change', async (e) => {
  if (!editing) return;
  const val = (a) => { const el = e.target.closest(`[data-${a}]`); return el ? [+el.dataset[a], el] : [null, null]; };
  if (e.target.id === 'theme') { editing.game.theme = e.target.value; editing.dirty = true; return render(); }
  let [i, el] = val('type');
  if (el) {
    const r = editing.rounds[i];
    if (typeFilled(r) && !confirm('Switch the question type? This round’s answer fields are cleared; question, photo and story stay.')) return render();
    for (const k of ['spec', 'lat', 'lng', 'city', 'country', 'geometry', 'radius', 'maxkm', 'shapeText', 'shapeLabel', 'shapeErr']) delete r[k];
    r.type = el.value;
    if (r.type === 'location') { r.lat = NaN; r.lng = NaN; } else r.spec = NEW_SPEC[r.type]();
    editing.dirty = true; return render();
  }
  const pair = (a) => { const t = e.target.closest(`[data-${a}]`); return t ? [...t.dataset[a].split(':'), t] : null; };
  const p = pair('correct');
  if (p) { editing.rounds[+p[0]].spec.correct = +p[1]; editing.dirty = true; return render(); }
  [i, el] = val('shape');
  if (el) {
    const r = editing.rounds[i], text = el.value.trim();
    delete r.shapeErr;
    if (!text) { delete r.geometry; delete r.shapeText; delete r.shapeLabel; editing.dirty = true; return render(); }
    const p = parseShape(text);
    r.shapeText = text;
    if (p.error) { r.shapeErr = p.error; delete r.geometry; delete r.shapeLabel; editing.dirty = true; return render(); }
    r.geometry = p.geometry; r.shapeLabel = p.label;
    r.lat = p.lat; r.lng = p.lng; delete r.city; delete r.country;
    editing.dirty = true; return render();
  }
  [i, el] = val('coords');
  if (el) {
    const r = editing.rounds[i];
    const c = parseCoords(el.value);
    delete r.city; delete r.country;
    [r.lat, r.lng] = c || [NaN, NaN];
    editing.dirty = true; return render();
  }
  for (const key of ['photo', 'qphoto', 'limg']) { // reveal photo / question image / label picture: same upload
    [i, el] = val(key);
    if (!el || !el.files[0]) continue;
    const f = el.files[0], r = editing.rounds[i];
    setStatus('Uploading…');
    try {
      const resp = await fetch('/api/upload', { method: 'POST', headers: { 'content-type': f.type }, body: f });
      if (!resp.ok) throw new Error(resp.status);
      const file = (await resp.json()).file;
      if (key === 'limg') r.spec.image = file; else r[key] = file;
      editing.dirty = true; render();
    } catch { setStatus('Upload failed — jpeg/png/webp/gif up to 8 MB', true); }
    return;
  }
  [i, el] = val('city');
  if (!el) return;
  const r = editing.rounds[i];
  const q = el.value.trim();
  delete r.city; delete r.country; r.lat = NaN; r.lng = NaN;
  editing.dirty = true;
  if (!q) return render();
  const c = parseCoords(q); // coordinates pasted into the city box: take them as the spot
  if (c) { [r.lat, r.lng] = c; return render(); }
  r.city = q; // fallback: raw text with ⚠ until a suggestion is picked
  let hits = [];
  try {
    const resp = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1'
      + `&accept-language=en&limit=5&q=${encodeURIComponent(q)}`);
    hits = await resp.json();
  } catch {} // offline/rate-limited: ⚠ shows, retype later to retry
  if (!hits.length) return render();
  const sug = document.createElement('div');
  sug.className = 'sug';
  for (const h of hits) {
    const a = h.address || {};
    const city = a.city || a.town || a.village || a.hamlet || a.municipality || h.name || q;
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = [city, a.state, a.country].filter(Boolean).join(', ');
    b.onclick = () => {
      r.city = city;
      if (a.country) r.country = a.country;
      r.lat = +h.lat; r.lng = +h.lon;
      render();
    };
    sug.appendChild(b);
  }
  el.closest('.locrow').appendChild(sug);
});
// Click anywhere else: dismiss open suggestion lists.
document.addEventListener('click', (e) => {
  if (document.querySelector('.sug') && !e.target.closest('.sug')) render();
});

$('new').addEventListener('click', async () => {
  const title = (prompt('Game title? — e.g. Daniel’s 30th') || '').trim();
  if (!title) return;
  const g = await (await fetch('/api/admin/games', {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title }),
  })).json();
  openEditor(g.id);
});

$('back').addEventListener('click', () => {
  if (editing.dirty && !confirm('Discard unsaved changes?')) return;
  loadList();
});

$('save').addEventListener('click', async () => {
  const bad = editing.rounds.findIndex(problem);
  if (bad !== -1) {
    const msg = `Round ${bad + 1} ${problem(editing.rounds[bad])}`;
    editing.sel = bad; render();
    return setStatus(msg, true);
  }
  if ((editing.sessions || []).some((s) => s.state !== 'finished')
    && !confirm('A live session is running on this game. Saving changes the rounds under it. Continue?')) return;
  $('save').disabled = true;
  setStatus('Saving…');
  try {
    const resp = await fetch(`/api/admin/games/${editing.game.id}`, {
      method: 'PUT', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ title: editing.game.title, theme: editing.game.theme,
        rounds: editing.rounds.map(({ shapeText, shapeLabel, shapeErr, ...r }) => r) }),
    });
    if (resp.status === 400) {
      const d = await resp.json();
      if (Number.isInteger(d.round) && editing.rounds[d.round]) {
        if (typeOf(editing.rounds[d.round]) === 'location' && /shape/.test(d.error)) editing.rounds[d.round].shapeErr = d.error;
        editing.sel = d.round; render();
      }
      setStatus(d.error, true); $('save').disabled = false; return;
    }
    if (!resp.ok) throw new Error(resp.status);
    const d = await resp.json();
    editing = { game: d.game, rounds: d.rounds, sessions: editing.sessions, dirty: false, sel: editing.sel };
    render();
    setStatus('Saved ' + new Date().toLocaleTimeString());
  } catch { setStatus('Save failed — try again', true); $('save').disabled = false; }
});

window.addEventListener('beforeunload', (e) => {
  if (editing && editing.dirty) { e.preventDefault(); e.returnValue = ''; }
});

loadList().catch(() => { $('main').textContent = 'Could not load games.'; });
</script>
</body>
</html>
