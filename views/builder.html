<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.6.0/dist/maplibre-gl.css">
<style>
  :root {
    color-scheme: dark;
    --bg: #070b1c; --bg-2: #0a1030; --panel: rgba(16,22,52,.9); --border: rgba(130,155,255,.16);
    --text: #eaf0ff; --muted: #a3aed8; --cyan: #22d3ee; --red: #f0616a; --amber: #ffb020; --ink: #1a1205;
    --display: "Space Grotesk", Inter, sans-serif;
    --body: Inter, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; padding: 40px 20px 80px; color: var(--text);
    font: 15px/1.5 var(--body); background: radial-gradient(1200px 800px at 50% -5%, var(--bg-2), var(--bg) 70%); }
  .wrap { max-width: 760px; margin: 0 auto; }
  a.back { color: var(--muted); text-decoration: none; font-family: var(--mono); font-size: .95rem; }
  a.back:hover { color: var(--cyan); }
  h1 { font: 700 1.8rem/1.1 var(--display); letter-spacing: -.01em; margin: 10px 0 6px; }
  p.hint { color: var(--muted); font-size: .9rem; margin: 0 0 18px; }
  .bar { display: flex; align-items: center; gap: 12px; margin: 0 0 20px; position: sticky; top: 0;
    background: linear-gradient(var(--bg-2), rgba(10,16,48,.6)); padding: 10px 0; z-index: 5; }
  button { font-family: var(--mono); cursor: pointer; border-radius: 999px; border: 1px solid var(--border);
    background: rgba(10,14,34,.72); color: var(--text); padding: 8px 16px; font-size: .9rem; transition: background .15s, border-color .15s; }
  button:hover { border-color: rgba(34,211,238,.4); }
  button.primary { background: var(--amber); border-color: var(--amber); color: var(--ink); font-weight: 700; }
  button.primary:disabled { opacity: .45; cursor: default; }
  button.sm { padding: 4px 10px; font-size: .8rem; min-width: 36px; min-height: 36px; }
  #status { font-family: var(--mono); font-size: .85rem; color: var(--muted); margin-left: auto; }

  .game { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--panel);
    border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px; margin-bottom: 10px; }
  .game .t { font: 700 1.05rem var(--display); flex: 1; min-width: 140px; }
  .game .meta { font: .75rem var(--mono); color: var(--muted); }
  .game .sessions { flex-basis: 100%; font: .75rem var(--mono); color: var(--muted); }
  .game .sessions a { color: var(--cyan); text-decoration: none; }
  .game .sessions .fin { opacity: .6; }
  .empty { color: var(--muted); font-style: italic; }

  .title { font: 700 1.5rem var(--display); margin: 0 0 4px; cursor: text; }
  .themepick { display: inline-flex; align-items: center; gap: 8px; font: .8rem var(--mono); color: var(--muted); margin: 0 0 14px; }
  .themepick select, select.type { appearance: none; background: rgba(10,14,34,.72); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 6px 26px 6px 10px; font: 600 .8rem var(--mono);
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: right 12px center, right 7px center; background-size: 5px 5px; background-repeat: no-repeat; }
  .geo svg, button.sm svg { vertical-align: middle; }
  .geo { display: inline-flex; }
  .geo.ok { color: #4ade80; } .geo.no { color: var(--amber); }
  .title:hover { color: var(--cyan); }
  .share { font: .8rem var(--mono); color: var(--muted); margin: 0 0 16px; overflow-wrap: anywhere; }
  .round { background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 12px; }
  .round .head { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
  .round .head .n { font: .75rem var(--mono); color: var(--cyan); flex: none; width: 26px; }
  input[type=text], textarea { background: rgba(10,14,34,.72); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); padding: 6px 8px; font: .82rem var(--mono); }
  input[type=text]:focus, textarea:focus { outline: none; border-color: rgba(34,211,238,.4); }
  .round .q { flex: 1; min-width: 0; font: 600 .95rem var(--body); }
  .locrow { display: flex; gap: 6px; margin: 8px 0; position: relative; align-items: center; }
  .locrow .city { flex: 3; min-width: 0; }
  .locrow .coords { flex: 2; min-width: 0; }
  .locrow .geo { flex: none; font: .78rem var(--mono); color: var(--muted); }
  .sug { position: absolute; top: 100%; left: 0; right: 0; z-index: 6; display: flex; flex-direction: column;
    background: var(--bg-2); border: 1px solid rgba(34,211,238,.4); border-radius: 10px; overflow: hidden; }
  .sug button { border: 0; border-radius: 0; text-align: left; font-size: .8rem; padding: 7px 10px; }
  .sug button:hover { background: rgba(34,211,238,.12); color: var(--cyan); }
  .ansrow { display: flex; gap: 6px; margin: 8px 0; align-items: center; }
  .ansrow .answer { flex: 1; min-width: 0; }
  .ansrow .radius { width: 64px; text-align: right; }
  .ansrow .unit { font: .78rem var(--mono); color: var(--muted); }
  details.shape { margin: 8px 0; border: 1px dashed var(--border); border-radius: 8px; padding: 6px 10px; }
  details.shape summary { cursor: pointer; font: .78rem var(--mono); color: var(--muted); }
  details.shape textarea { width: 100%; min-height: 64px; resize: vertical; font: .75rem var(--mono); margin-top: 6px; }
  details.shape .st { font: .75rem var(--mono); color: var(--muted); margin: 4px 0; }
  details.shape .st.ok { color: var(--cyan); }
  details.shape .st.err { color: var(--red); }
  details.shape .links { font: .75rem var(--mono); color: var(--muted); margin: 4px 0; }
  details.shape .links a { color: var(--cyan); text-decoration: none; }
  .phrow { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
  .phrow img { width: 96px; height: 72px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
  .addph { display: inline-flex; align-items: center; justify-content: center; width: 96px; height: 72px; cursor: pointer;
    border: 1px dashed var(--border); border-radius: 8px; color: var(--muted); font: .78rem var(--mono); }
  .addph:hover { border-color: rgba(34,211,238,.4); color: var(--cyan); }
  .story { width: 100%; resize: vertical; min-height: 34px; font: .82rem/1.45 var(--body); }
  select.type { background: rgba(10,14,34,.72); border: 1px solid var(--border); border-radius: 8px; color: var(--cyan);
    padding: 6px 4px; font: .78rem var(--mono); flex: none; }
  .accept { width: 100%; min-height: 56px; resize: vertical; margin: 8px 0 2px; }
  .tnote { font: .72rem var(--mono); color: var(--muted); margin-bottom: 6px; }
  .opt { display: flex; gap: 6px; align-items: center; margin: 6px 0; }
  .opt input[type=text] { flex: 1; min-width: 0; }
  .opt input[type=radio] { accent-color: var(--cyan); width: 18px; height: 18px; flex: none; margin: 0; }
  .numrow { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .numrow label { display: flex; flex-direction: column; gap: 3px; font: .72rem var(--mono); color: var(--muted); flex: 1 1 120px; min-width: 0; }
  .numrow input { width: 100%; }
  .del { border: 0; background: none; color: var(--muted); font-size: 1.05rem; line-height: 1;
    min-width: 36px; min-height: 36px; }
  .del:hover { color: var(--red); }

  #mapmodal { position: fixed; inset: 0; z-index: 20; background: var(--bg); }
  #mapmodal[hidden] { display: none; }
  #pickmap { position: absolute; inset: 0; }
  .maphint { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: var(--panel);
    border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; font: .8rem var(--mono);
    color: var(--text); pointer-events: none; white-space: nowrap; }
  #mapclose { position: absolute; top: 10px; right: 10px; z-index: 21; }
  .mapcredit { position: absolute; right: 8px; bottom: 6px; color: rgba(152,164,212,.8);
    font: .7rem var(--mono); pointer-events: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Game builder</h1>
  <p class="hint">Create a game, add rounds, share the link on WhatsApp. The link is the invitation —
    anyone who has it can play.</p>
  <div class="bar">
    <button id="new">+ New game</button>
    <button id="back" hidden>← Games</button>
    <button id="save" class="primary" hidden disabled>Save</button>
    <span id="status"></span>
  </div>
  <div id="main"></div>
</div>
<div id="mapmodal" hidden>
  <div id="pickmap"></div>
  <div class="maphint">Tap the secret spot — zoom in for precision</div>
  <button id="mapclose" aria-label="Close map">✕</button>
  <div class="mapcredit">Imagery © Esri &amp; contributors</div>
</div>
<script>
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (id) => document.getElementById(id);
let games = [];
let editing = null; // { game, rounds, dirty }

const fmtCoords = (r) => Number.isFinite(r.lat) ? `${r.lat}, ${r.lng}` : '';
// Client-side read of pasted GeoJSON: enough to label it and place the anchor. The server re-validates.
const KINDS = { Point: 'point', MultiPoint: 'point', LineString: 'line', MultiLineString: 'line', Polygon: 'area', MultiPolygon: 'area' };
const ERR_180 = 'shapes that cross the 180° meridian are not supported';
function parseShape(text) {
  let v;
  try { v = JSON.parse(text); } catch { return { error: 'not valid JSON' }; }
  let geoms = v && v.type === 'Feature' ? [v.geometry] : v && v.type === 'FeatureCollection' ? (v.features || []).map((f) => f && f.geometry) : [v];
  geoms = geoms.filter(Boolean);
  if (!geoms.length || geoms.some((g) => typeof g.type !== 'string' || !Object.hasOwn(KINDS, g.type) || !Array.isArray(g.coordinates))) return { error: 'invalid shape' };
  if (new Set(geoms.map((g) => KINDS[g.type])).size > 1) return { error: 'paste one kind of shape (all lines, or all areas)' };
  const kind = KINDS[geoms[0].type];
  let n = 0, invalid = false, minLat = 90, maxLat = -90, minLng = 180, maxLng = -180;
  const walk = (c) => {
    if (!Array.isArray(c)) { invalid = true; return; }
    if (typeof c[0] === 'number') {
      if (typeof c[1] !== 'number') { invalid = true; return; }
      n++; minLng = Math.min(minLng, c[0]); maxLng = Math.max(maxLng, c[0]); minLat = Math.min(minLat, c[1]); maxLat = Math.max(maxLat, c[1]);
    } else c.forEach(walk);
  };
  for (const g of geoms) walk(g.coordinates);
  if (invalid || !n || ![minLat, maxLat, minLng, maxLng].every(Number.isFinite)) return { error: 'invalid shape' };
  // Merge like the server: every feature's parts into one Multi* geometry (or a single one when there is just one part).
  const parts = geoms.flatMap((g) => (g.type.startsWith('Multi') ? g.coordinates : [g.coordinates]));
  const base = kind === 'point' ? 'Point' : kind === 'line' ? 'LineString' : 'Polygon';
  const geometry = parts.length === 1 ? { type: base, coordinates: parts[0] } : { type: 'Multi' + base, coordinates: parts };
  // Lines and rings are runs of positions; a >180° jump in longitude means they cross the 180° meridian.
  const runs = kind === 'line' ? parts : kind === 'area' ? parts.flatMap((p) => (Array.isArray(p) ? p : [])) : [];
  if (runs.some((s) => Array.isArray(s) && s.some((p, i) => i > 0 && Array.isArray(p) && Array.isArray(s[i - 1]) && Math.abs(p[0] - s[i - 1][0]) > 180))) return { error: ERR_180 };
  return { geometry, label: shapeLabelOf(geometry, n), lat: +((minLat + maxLat) / 2).toFixed(5), lng: +((minLng + maxLng) / 2).toFixed(5) };
}
const shapeLabelOf = (g, n) => `${g.type}${g.type.startsWith('Multi') ? ` · ${g.coordinates.length.toLocaleString()} parts` : ''} · ${n.toLocaleString()} point${n === 1 ? '' : 's'}`;
const shapeLabel = (r) => (r.shapeLabel || (r.geometry ? shapeLabelOf(r.geometry, countPositions(r.geometry)) : ''));
function countPositions(g) { let n = 0; const walk = (c) => { if (!Array.isArray(c)) return; if (typeof c[0] === 'number') n++; else c.forEach(walk); }; walk(g.coordinates); return n; }
const setStatus = (t) => { $('status').textContent = t; };

// Question types (server: src/types.js). Location rounds keep today's fields.
const TYPE_LABELS = { location: 'Location', text: 'Typed answer', choice: 'Multiple choice', number: 'Number' };
const THEMES = { gameshow: 'Game show', railway: 'Railway' };
const ICON = {
  map: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>',
  ok: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>',
  warn: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2zM12 10v5M12 18h.01"/></svg>',
};
const Q_HINT = { location: 'Question — e.g. Where was Daniel born?', text: 'Question — e.g. Which tunnel is the longest in the world?',
  choice: 'Question — e.g. Which station has the most platforms?', number: 'Question — e.g. How long is the Gotthard Base Tunnel?' };
const NEW_SPEC = { text: () => ({ accept: [] }), choice: () => ({ options: ['', ''], correct: 0 }), number: () => ({}) };
const typeOf = (r) => r.type || 'location';
const defaultHalve = (v) => (Number.isFinite(v) ? +Math.max(Math.abs(v) / 10, 1).toPrecision(3) : '');
// Anything typed into the type-specific fields, i.e. what switching type would throw away.
const typeFilled = (r) => Number.isFinite(r.lat) || !!r.geometry
  || (r.spec != null && JSON.stringify(r.spec) !== JSON.stringify(NEW_SPEC[typeOf(r)]?.()));
function typeFields(r, i) {
  const s = r.spec || {};
  if (typeOf(r) === 'text') return `
    <textarea class="accept" data-accept="${i}" aria-label="Accepted answers, one per line"
      placeholder="Accepted answers — one per line, e.g.&#10;Gotthard Base Tunnel&#10;Gotthard">${esc((s.accept || []).join('\n'))}</textarea>
    <div class="tnote">Case, accents, punctuation and small typos are forgiven. Answers with digits must match exactly.</div>`;
  if (typeOf(r) === 'choice') {
    const opts = s.options || [];
    return `<div class="opts">${opts.map((o, j) => `
      <div class="opt">
        <input type="radio" name="correct${i}" data-correct="${i}:${j}" ${s.correct === j ? 'checked' : ''} aria-label="Mark option ${j + 1} correct" title="The correct answer">
        <input type="text" data-opt="${i}:${j}" value="${esc(o)}" placeholder="Option ${j + 1}" aria-label="Option ${j + 1}">
        <button class="del" data-delopt="${i}:${j}" ${opts.length <= 2 ? 'disabled' : ''} title="Remove option" aria-label="Remove option ${j + 1}">✕</button>
      </div>`).join('')}
      ${opts.length < 6 ? `<button class="sm" data-addopt="${i}">+ option</button>` : ''}
      <div class="tnote">Tick the correct option. Right = 100 pts, wrong = 0.</div></div>`;
  }
  const num = (k, label, ph, extra = '') => `<label>${label}<input type="text" inputmode="decimal" data-num="${i}:${k}"
    value="${esc(s[k] ?? '')}" placeholder="${esc(ph)}" ${extra}></label>`;
  return `<div class="numrow">
      ${num('value', 'Answer', 'e.g. 57')}
      <label>Unit (optional)<input type="text" data-num="${i}:unit" value="${esc(s.unit ?? '')}" placeholder="e.g. km" maxlength="20"></label>
      ${num('tolerance', 'Full points within ±', '0')}
      ${num('halve', 'Points halve every ±', defaultHalve(s.value) || '10 % of answer', 'title="Leave empty for 10 % of the answer; set it for years (e.g. 10)"')}
    </div>`;
}

function render() {
  $('back').hidden = $('save').hidden = !editing;
  $('new').hidden = !!editing;
  if (!editing) { renderList(); return; }
  $('save').disabled = !editing.dirty;
  setStatus(editing.dirty ? 'Unsaved changes' : '');
  renderEditor();
}

function renderList() {
  setStatus('');
  $('main').innerHTML = games.length ? games.map((g) => `
    <div class="game">
      <span class="t">${esc(g.title)}</span>
      <span class="meta">${g.rounds} rounds · ${g.plays} plays · ${esc(THEMES[g.theme] || '')} · ${g.created_at.slice(0, 10)}</span>
      <button class="sm" data-copy="${esc(g.slug)}">Copy link</button>
      <button class="sm" data-live="${g.id}" ${g.rounds ? '' : 'disabled title="Add rounds first"'}>Go live</button>
      <button class="sm" data-edit="${g.id}">Edit</button>
      <button class="del" data-del="${g.id}" title="Delete game" aria-label="Delete game">✕</button>
      ${(g.sessions || []).length ? `<div class="sessions">${g.sessions.map((s) => `
        <span class="${s.state === 'finished' ? 'fin' : ''}">${s.state === 'finished' ? 'finished' : 'LIVE · ' + esc(s.state)} ·
        ${s.players} player${s.players === 1 ? '' : 's'} · ${esc(s.created_at.slice(0, 10))} ·
        <a href="/host/${esc(s.code)}" target="_blank" rel="noopener">host page</a></span>`).join('<br>')}</div>` : ''}
    </div>`).join('')
    : '<p class="empty">No games yet — press “+ New game”.</p>';
}

function renderEditor() {
  const { game, rounds } = editing;
  $('main').innerHTML = `
    <div class="title" id="rename" title="Click to rename">${esc(game.title)}</div>
    <label class="themepick">Theme <select id="theme" aria-label="Theme">${Object.entries(THEMES).map(([v, l]) =>
      `<option value="${v}" ${(game.theme || 'gameshow') === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    <p class="share">Share link: ${esc(location.origin)}/${esc(game.slug)}
      <button class="sm" data-copy="${esc(game.slug)}">Copy</button></p>
    ${rounds.map((r, i) => `
    <div class="round">
      <div class="head">
        <span class="n">#${i + 1}</span>
        <select class="type" data-type="${i}" aria-label="Question type">${Object.entries(TYPE_LABELS).map(([v, l]) =>
          `<option value="${v}" ${typeOf(r) === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <input type="text" class="q" data-q="${i}" placeholder="${esc(Q_HINT[typeOf(r)])}" value="${esc(r.question)}">
        <button class="sm" data-up="${i}" aria-label="Move round up" ${i === 0 ? 'disabled' : ''}>↑</button>
        <button class="sm" data-down="${i}" aria-label="Move round down" ${i === rounds.length - 1 ? 'disabled' : ''}>↓</button>
        <button class="del" data-delround="${i}" title="Remove round" aria-label="Remove round">✕</button>
      </div>
      ${typeOf(r) !== 'location' ? typeFields(r, i) : `<div class="locrow">
        <input type="text" class="city" data-city="${i}" placeholder="City — type, then pick from the list"
          value="${esc([r.city, r.country].filter(Boolean).join(', '))}" ${r.geometry ? 'disabled' : ''}>
        <input type="text" class="coords" data-coords="${i}" placeholder="or lat, lng" value="${esc(fmtCoords(r))}" ${r.geometry ? 'disabled title="Anchor set from the shape"' : ''}>
        <button class="sm" data-mappick="${i}" title="${r.geometry ? 'Preview the shape on a map' : 'Pick the spot on a map'}" aria-label="Open the map">${ICON.map}</button>
        ${Number.isFinite(r.lat) ? `<span class="geo ok" title="Location set">${ICON.ok}</span>` : `<span class="geo no" title="No location yet">${ICON.warn}</span>`}
      </div>
      <details class="shape" ${r.geometry ? 'open' : ''}>
        <summary>Shape (line or area) — optional${r.geometry ? ` · ${esc(shapeLabel(r))}` : ''}</summary>
        <textarea data-shape="${i}" placeholder='Paste GeoJSON here — a line or an area, e.g. {"type":"LineString","coordinates":[[lng,lat],[lng,lat]]}'>${esc(r.shapeText ?? (r.geometry ? JSON.stringify(r.geometry) : ''))}</textarea>
        <div class="st ${r.shapeErr ? 'err' : r.geometry ? 'ok' : ''}">${esc(r.shapeErr || (r.geometry ? shapeLabel(r) + ' · anchor set to its centre' : 'No shape — this round is a point'))}</div>
        <div class="links">Draw one at <a href="https://geojson.io" target="_blank" rel="noopener">geojson.io</a> ·
          export from OpenStreetMap at <a href="https://overpass-turbo.eu" target="_blank" rel="noopener">overpass-turbo.eu</a> ·
          simplify big files at <a href="https://mapshaper.org" target="_blank" rel="noopener">mapshaper.org</a></div>
        ${r.geometry ? `<button class="sm" data-mappick="${i}">Preview</button> <button class="sm" data-shapeclear="${i}">Clear shape</button>` : ''}
      </details>`}
      <div class="ansrow">
        <input type="text" class="answer" data-answer="${i}" value="${esc(r.answer || '')}" aria-label="Answer label for the reveal"
          placeholder="${typeOf(r) === 'location' ? 'Answer label for the reveal (optional) — e.g. Tanggula, Qinghai–Tibet Railway, China'
            : 'Answer label for the reveal (optional) — defaults to the right answer'}">
        ${typeOf(r) === 'location' ? `<input type="text" inputmode="decimal" class="radius" data-radius="${i}" value="${esc(r.radius ?? '')}"
          placeholder="±25" title="Full points within this many km of the pin" aria-label="Full-points radius in km">
        <span class="unit">km</span>` : ''}
      </div>
      <div class="phrow">
        ${r.photo ? `<img src="/uploads/${esc(r.photo)}" alt=""><button class="del" data-delphoto="${i}" title="Remove photo" aria-label="Remove photo">✕</button>`
                  : `<label class="addph">+ photo<input type="file" accept="image/*" data-photo="${i}" hidden></label>`}
      </div>
      <textarea class="story" data-story="${i}" placeholder="The reveal story — shown after everyone guesses">${esc(r.story || '')}</textarea>
    </div>`).join('')}
    <button id="addround">+ Round</button>`;
}

async function loadList() {
  games = (await (await fetch('/api/admin/games')).json()).games;
  await Promise.all(games.map(async (g) => {
    g.sessions = (await (await fetch(`/api/admin/games/${g.id}/sessions`)).json()).sessions;
  }));
  editing = null;
  render();
}

async function openEditor(id) {
  const d = await (await fetch(`/api/admin/games/${id}`)).json();
  const { sessions } = await (await fetch(`/api/admin/games/${id}/sessions`)).json();
  editing = { game: d.game, rounds: d.rounds, sessions, dirty: false };
  render();
}

function copyLink(slug) {
  const url = `${location.origin}/${slug}`;
  // clipboard API needs https; on plain http fall back to a copyable prompt
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => setStatus('Link copied'));
  else prompt('Copy the link:', url);
}

// Full-screen click-to-pick map. MapLibre loads lazily on first open (~1MB —
// only game builders pay for it, and only if they use the map).
let pickmap = null, pickIdx = null, maplibregl = null, pickReady = false;
// Draw the current round's shape on the picker (or clear it) and frame it.
function showShape() {
  if (!pickReady) return;
  const r = editing && editing.rounds[pickIdx];
  const g = r && r.geometry;
  pickmap.getSource('shape').setData(g ? { type: 'Feature', geometry: g } : { type: 'FeatureCollection', features: [] });
  document.querySelector('.maphint').textContent = g ? 'Previewing the shape — clear it on the card to pick a point' : 'Tap the secret spot — zoom in for precision';
  if (!g) return;
  const b = new maplibregl.LngLatBounds();
  const walk = (c) => (typeof c[0] === 'number' ? b.extend(c) : c.forEach(walk));
  walk(g.coordinates);
  pickmap.fitBounds(b, { padding: 60, maxZoom: 9, duration: 0 });
}
async function openMapPicker(i) {
  pickIdx = i;
  $('mapmodal').hidden = false;
  if (!pickmap) {
    maplibregl = await import('https://cdn.jsdelivr.net/npm/maplibre-gl@6.6.0/dist/maplibre-gl.mjs');
    pickmap = new maplibregl.Map({
      container: 'pickmap',
      attributionControl: false, // .mapcredit carries the Esri notice
      minZoom: 1, maxZoom: 17, center: [10, 35], zoom: 1.5,
      style: { version: 8,
        sources: { sat: { type: 'raster', tileSize: 256, maxzoom: 17,
          tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'] } },
        layers: [{ id: 'sat', type: 'raster', source: 'sat' }] },
    });
    window.pickmap = pickmap; // console/debug handle (screenshot driver uses it)
    pickmap.on('load', () => {
      pickmap.addSource('shape', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      pickmap.addLayer({ id: 'shape-fill', type: 'fill', source: 'shape', filter: ['==', ['geometry-type'], 'Polygon'],
        paint: { 'fill-color': '#ffd15c', 'fill-opacity': 0.25 } });
      pickmap.addLayer({ id: 'shape-line', type: 'line', source: 'shape', filter: ['!=', ['geometry-type'], 'Point'],
        paint: { 'line-color': '#ffd15c', 'line-width': 3 } });
      pickmap.addLayer({ id: 'shape-pt', type: 'circle', source: 'shape', filter: ['==', ['geometry-type'], 'Point'],
        paint: { 'circle-radius': 6, 'circle-color': '#ffd15c', 'circle-stroke-color': '#070b1c', 'circle-stroke-width': 2 } });
      pickReady = true; showShape();
    });
    pickmap.on('click', async (e) => {
      if (editing && editing.rounds[pickIdx] && editing.rounds[pickIdx].geometry) return;
      const r = editing && editing.rounds[pickIdx];
      if (!r) return;
      r.lat = +e.lngLat.lat.toFixed(5);
      r.lng = +e.lngLat.wrap().lng.toFixed(5);
      delete r.city; delete r.country;
      editing.dirty = true;
      $('mapmodal').hidden = true;
      render();
      try { // best-effort city label for the reveal; the coords are already set
        const resp = await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2'
          + `&accept-language=en&zoom=10&lat=${r.lat}&lon=${r.lng}`);
        const a = (await resp.json()).address || {};
        const city = a.city || a.town || a.village || a.hamlet || a.municipality || a.county;
        if (city) { r.city = city; if (a.country) r.country = a.country; render(); }
      } catch {}
    });
  }
  const r = editing.rounds[i];
  if (Number.isFinite(r.lat)) pickmap.jumpTo({ center: [r.lng, r.lat], zoom: 8 });
  pickmap.resize(); // the container was display:none when the map last measured itself
  showShape();
}
$('mapclose').addEventListener('click', () => { $('mapmodal').hidden = true; });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('mapmodal').hidden = true; });

const main = $('main');
main.addEventListener('click', async (e) => {
  const btn = (a) => e.target.closest(`[data-${a}]`)?.dataset[a];
  const copy = btn('copy');
  if (copy) return copyLink(copy);
  const edit = btn('edit');
  if (edit) return openEditor(edit);
  const live = btn('live');
  if (live) {
    const resp = await fetch(`/api/admin/games/${live}/sessions`, { method: 'POST' });
    if (!resp.ok) return setStatus('Could not start a session');
    const { code } = await resp.json();
    window.open(`/host/${code}`, '_blank', 'noopener');
    return loadList();
  }
  const del = btn('del');
  if (del) {
    const g = games.find((x) => x.id === +del);
    if (!confirm(`Delete "${g.title}" and all its rounds and plays? This cannot be undone.`)) return;
    await fetch(`/api/admin/games/${del}`, { method: 'DELETE' });
    return loadList();
  }
  if (!editing) return;
  if (e.target.id === 'addround') {
    editing.rounds.push({ question: '', lat: NaN, lng: NaN });
    editing.dirty = true; return render();
  }
  if (e.target.id === 'rename') {
    const t = (prompt('Game title?', editing.game.title) || '').trim();
    if (t && t !== editing.game.title) { editing.game.title = t; editing.dirty = true; render(); }
    return;
  }
  const mappick = btn('mappick');
  if (mappick !== undefined) return openMapPicker(+mappick);
  const up = btn('up'), down = btn('down'), delround = btn('delround'), delphoto = btn('delphoto');
  const swap = (i, j) => { const r = editing.rounds; [r[i], r[j]] = [r[j], r[i]]; editing.dirty = true; render(); };
  if (up !== undefined) return swap(+up, +up - 1);
  if (down !== undefined) return swap(+down, +down + 1);
  if (delround !== undefined) { editing.rounds.splice(+delround, 1); editing.dirty = true; return render(); }
  if (delphoto !== undefined) { delete editing.rounds[+delphoto].photo; editing.dirty = true; return render(); }
  const addopt = btn('addopt');
  if (addopt !== undefined) { editing.rounds[+addopt].spec.options.push(''); editing.dirty = true; return render(); }
  const delopt = btn('delopt');
  if (delopt !== undefined) {
    const [i, j] = delopt.split(':').map(Number), s = editing.rounds[i].spec;
    s.options.splice(j, 1);
    if (s.correct === j) s.correct = 0; else if (s.correct > j) s.correct -= 1;
    editing.dirty = true; return render();
  }
  const shapeclear = btn('shapeclear');
  if (shapeclear !== undefined) {
    const r = editing.rounds[+shapeclear];
    delete r.geometry; delete r.shapeText; delete r.shapeLabel; delete r.shapeErr;
    editing.dirty = true; return render();
  }
});

main.addEventListener('change', async (e) => {
  if (!editing) return;
  const val = (a) => { const el = e.target.closest(`[data-${a}]`); return el ? [+el.dataset[a], el] : [null, null]; };
  if (e.target.id === 'theme') { editing.game.theme = e.target.value; editing.dirty = true; return render(); }
  let [i, el] = val('type');
  if (el) {
    const r = editing.rounds[i];
    if (typeFilled(r) && !confirm('Switch the question type? This round’s answer fields are cleared; question, photo and story stay.')) return render();
    for (const k of ['spec', 'lat', 'lng', 'city', 'country', 'geometry', 'radius', 'shapeText', 'shapeLabel', 'shapeErr']) delete r[k];
    r.type = el.value;
    if (r.type === 'location') { r.lat = NaN; r.lng = NaN; } else r.spec = NEW_SPEC[r.type]();
    editing.dirty = true; return render();
  }
  [i, el] = val('accept');
  if (el) { editing.rounds[i].spec = { accept: el.value.split('\n').map((x) => x.trim()).filter(Boolean) }; editing.dirty = true; return render(); }
  const pair = (a) => { const t = e.target.closest(`[data-${a}]`); return t ? [...t.dataset[a].split(':'), t] : null; };
  let p = pair('opt');
  if (p) { editing.rounds[+p[0]].spec.options[+p[1]] = p[2].value; editing.dirty = true; return render(); }
  p = pair('correct');
  if (p) { editing.rounds[+p[0]].spec.correct = +p[1]; editing.dirty = true; return render(); }
  p = pair('num');
  if (p) {
    const s = editing.rounds[+p[0]].spec, k = p[1], raw = p[2].value.trim();
    if (k === 'unit') { if (raw) s.unit = raw; else delete s.unit; }
    else if (raw === '') delete s[k];
    else s[k] = Number(raw.replace(/[\s_']/g, '')); // NaN stays visible as a save error
    editing.dirty = true; return render();
  }
  [i, el] = val('q');
  if (el) { editing.rounds[i].question = el.value; editing.dirty = true; return render(); }
  [i, el] = val('story');
  if (el) { editing.rounds[i].story = el.value; editing.dirty = true; return render(); }
  [i, el] = val('answer');
  if (el) {
    const r = editing.rounds[i];
    if (el.value.trim()) r.answer = el.value; else delete r.answer;
    editing.dirty = true; return render();
  }
  [i, el] = val('radius');
  if (el) {
    const r = editing.rounds[i], v = parseFloat(el.value);
    if (Number.isFinite(v) && v > 0) r.radius = v; else delete r.radius;
    editing.dirty = true; return render();
  }
  [i, el] = val('shape');
  if (el) {
    const r = editing.rounds[i], text = el.value.trim();
    delete r.shapeErr;
    if (!text) { delete r.geometry; delete r.shapeText; delete r.shapeLabel; editing.dirty = true; return render(); }
    const p = parseShape(text);
    r.shapeText = text;
    if (p.error) { r.shapeErr = p.error; delete r.geometry; delete r.shapeLabel; editing.dirty = true; return render(); }
    r.geometry = p.geometry; r.shapeLabel = p.label;
    r.lat = p.lat; r.lng = p.lng; delete r.city; delete r.country;
    editing.dirty = true; return render();
  }
  [i, el] = val('coords');
  if (el) {
    const r = editing.rounds[i];
    const m = el.value.trim().match(/^(-?\d+(?:\.\d+)?)[,\s]+(-?\d+(?:\.\d+)?)$/);
    delete r.city; delete r.country;
    if (m) { r.lat = +m[1]; r.lng = +m[2]; } else { r.lat = NaN; r.lng = NaN; }
    editing.dirty = true; return render();
  }
  [i, el] = val('photo');
  if (el && el.files[0]) {
    const f = el.files[0], r = editing.rounds[i];
    try {
      const resp = await fetch('/api/upload', { method: 'POST', headers: { 'content-type': f.type }, body: f });
      if (!resp.ok) throw new Error(resp.status);
      r.photo = (await resp.json()).file;
      editing.dirty = true; render();
    } catch { alert('Upload failed — jpeg/png/webp/gif up to 8 MB.'); }
    return;
  }
  [i, el] = val('city');
  if (!el) return;
  const r = editing.rounds[i];
  const q = el.value.trim();
  delete r.city; delete r.country; r.lat = NaN; r.lng = NaN;
  editing.dirty = true;
  if (!q) return render();
  r.city = q; // fallback: raw text with ⚠ until a suggestion is picked
  let hits = [];
  try {
    const resp = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1'
      + `&accept-language=en&limit=5&q=${encodeURIComponent(q)}`);
    hits = await resp.json();
  } catch {} // offline/rate-limited: ⚠ shows, retype later to retry
  if (!hits.length) return render();
  const sug = document.createElement('div');
  sug.className = 'sug';
  for (const h of hits) {
    const a = h.address || {};
    const city = a.city || a.town || a.village || a.hamlet || a.municipality || h.name || q;
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = [city, a.state, a.country].filter(Boolean).join(', ');
    b.onclick = () => {
      r.city = city;
      if (a.country) r.country = a.country;
      r.lat = +h.lat; r.lng = +h.lon;
      render();
    };
    sug.appendChild(b);
  }
  el.closest('.locrow').appendChild(sug);
});
// Click anywhere else: dismiss open suggestion lists.
document.addEventListener('click', (e) => {
  if (document.querySelector('.sug') && !e.target.closest('.sug')) render();
});

$('new').addEventListener('click', async () => {
  const title = (prompt('Game title? — e.g. Daniel’s 30th') || '').trim();
  if (!title) return;
  const g = await (await fetch('/api/admin/games', {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title }),
  })).json();
  openEditor(g.id);
});

$('back').addEventListener('click', () => {
  if (editing.dirty && !confirm('Discard unsaved changes?')) return;
  loadList();
});

$('save').addEventListener('click', async () => {
  const problem = (r) => {
    if (!r.question.trim()) return 'needs a question';
    const s = r.spec || {};
    switch (typeOf(r)) {
      case 'text': return s.accept && s.accept.length ? '' : 'needs at least one accepted answer';
      case 'choice': return s.options.length >= 2 && s.options.every((o) => o.trim()) ? '' : 'needs 2–6 filled-in options';
      case 'number':
        if (!Number.isFinite(s.value)) return 'needs a number as its answer';
        return ['tolerance', 'halve'].every((k) => s[k] == null || (Number.isFinite(s[k]) && (k === 'halve' ? s[k] > 0 : s[k] >= 0))) ? '' : 'has a margin that is not a number';
      default: return r.shapeErr ? 'has a shape error — fix or clear the shape' : (Number.isFinite(r.lat) || r.geometry) ? '' : 'needs a location';
    }
  };
  const bad = editing.rounds.findIndex(problem);
  if (bad !== -1) return alert(`Round #${bad + 1} ${problem(editing.rounds[bad])} before saving.`);
  if ((editing.sessions || []).some((s) => s.state !== 'finished')
    && !confirm('A live session is running on this game. Saving changes the rounds under it. Continue?')) return;
  $('save').disabled = true;
  setStatus('Saving…');
  try {
    const resp = await fetch(`/api/admin/games/${editing.game.id}`, {
      method: 'PUT', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ title: editing.game.title, theme: editing.game.theme,
        rounds: editing.rounds.map(({ shapeText, shapeLabel, shapeErr, ...r }) => r) }),
    });
    if (resp.status === 400) {
      const d = await resp.json();
      if (Number.isInteger(d.round) && editing.rounds[d.round]) {
        if (typeOf(editing.rounds[d.round]) === 'location') editing.rounds[d.round].shapeErr = d.error;
        render();
        document.querySelectorAll('.round')[d.round].scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      setStatus(d.error); $('save').disabled = false; return;
    }
    if (!resp.ok) throw new Error(resp.status);
    const d = await resp.json();
    editing = { game: d.game, rounds: d.rounds, sessions: editing.sessions, dirty: false };
    render();
    setStatus('Saved ' + new Date().toLocaleTimeString());
  } catch { setStatus('Save failed — try again'); $('save').disabled = false; }
});

window.addEventListener('beforeunload', (e) => {
  if (editing && editing.dirty) { e.preventDefault(); e.returnValue = ''; }
});

loadList().catch(() => { $('main').textContent = 'Could not load games.'; });
</script>
</body>
</html>
