<!doctype html>
<html lang="en" data-theme="gameshow">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz · Play</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.6.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="/assets/quiz.css">
</head>
<body class="stage">
<div id="map"></div>
<div class="top">
  <div class="hud"><span id="rno"></span><span class="t" id="gtitle">Quiz</span><span class="tot" id="tot"></span></div>
  <div class="bar" id="bar"></div>
  <h1 class="q" id="question">Loading…</h1>
  <span class="hint" id="hint"></span>
</div>
<div id="answer" hidden></div>
<button id="action" hidden></button>
<div id="reveal" class="sheet" hidden aria-live="polite"></div>
<div class="ov" id="nameov" hidden><div class="card">
  <h1 id="wtitle">Quiz</h1>
  <p>Tap the globe, type, or pick your answer each round. Closer means more points. Your name goes on the leaderboard.</p>
  <input id="pname" maxlength="40" placeholder="Your name" aria-label="Your name" autocomplete="off">
  <button class="go" id="start">Play</button>
</div></div>
<div class="ov" id="endov" hidden><div class="card">
  <h1 id="endtitle"></h1>
  <div class="total" id="endtotal"></div>
  <div id="board"></div>
</div></div>
<div class="credit">Imagery © Esri &amp; contributors · MapLibre</div>
<script type="module">
import * as maplibregl from 'https://cdn.jsdelivr.net/npm/maplibre-gl@6.6.0/dist/maplibre-gl.mjs';
import { RM, el, applyTheme, w, verdictChip, flaps, countUp, confetti, pinElement, answerWidget, hud, stage, finalBoard, fmtNum }
  from '/assets/ui.js';

const $ = (id) => document.getElementById(id);
const slug = location.pathname.split('/').filter(Boolean).pop();
const api = (p, opts) => fetch(`/api/${slug}${p}`, opts);

const map = new maplibregl.Map({
  container: 'map',
  attributionControl: false, // the .credit line carries the Esri notice
  minZoom: 1, maxZoom: 17, center: [10, 25], zoom: 1.6,
  style: { version: 8,
    projection: { type: 'globe' },
    sources: { sat: { type: 'raster', tileSize: 256, maxzoom: 17,
      attribution: 'Imagery © Esri & contributors',
      tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'] } },
    layers: [{ id: 'sat', type: 'raster', source: 'sat' }],
    sky: { 'sky-color': '#02040f', 'horizon-color': '#0e5d7a', 'fog-color': '#070b1c',
      'sky-horizon-blend': 0.6, 'horizon-fog-blend': 0.6,
      'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 1, 6, 1, 8, 0.1] } },
});
window.map = map; // console/debug handle

let game = null, ord = 0, guesses = [], marker = null, phase = 'load'; // load|name|guess|reveal|done
let pick = null, total = 0; // pick: the current typed / chosen / estimated answer on non-location rounds
let playerName = '';
try { playerName = localStorage.getItem('maptap:player') || ''; } catch {}

const EMPTY = { type: 'FeatureCollection', features: [] };
let ready = false; // map.loaded() is false whenever tiles are in flight and 'load' fires once, so track readiness ourselves
// The reveal geometry as a feature: the round's shape, or a point at the anchor.
const truthFeature = (t) => ({ type: 'Feature', geometry: t.geometry || { type: 'Point', coordinates: [t.lng, t.lat] } });
// Extend bounds by every position of a geometry.
const extendBy = (bounds, geometry) => {
  const walk = (c) => (typeof c[0] === 'number' ? bounds.extend(c) : c.forEach(walk));
  walk(geometry.coordinates);
  return bounds;
};
map.on('load', () => {
  map.addSource('truth', { type: 'geojson', data: EMPTY });
  map.addSource('line', { type: 'geojson', data: EMPTY });
  // A shape round renders as fill + outline, a point round as the dot — geometry-type picks per feature.
  map.addLayer({ id: 'truth-fill', type: 'fill', source: 'truth', filter: ['==', ['geometry-type'], 'Polygon'],
    paint: { 'fill-color': '#ffd15c', 'fill-opacity': 0.25 } });
  map.addLayer({ id: 'line', type: 'line', source: 'line',
    paint: { 'line-color': '#ffb020', 'line-width': 2.5, 'line-dasharray': [1.5, 1.5] } });
  map.addLayer({ id: 'truth-line', type: 'line', source: 'truth', filter: ['!=', ['geometry-type'], 'Point'],
    paint: { 'line-color': '#ffd15c', 'line-width': 3 } });
  map.addLayer({ id: 'truth', type: 'circle', source: 'truth', filter: ['==', ['geometry-type'], 'Point'],
    paint: { 'circle-radius': 8, 'circle-color': '#ffd15c', 'circle-stroke-color': '#070b1c', 'circle-stroke-width': 3 } });
  ready = true;
});

const round = () => game.rounds[ord];
const isLoc = () => round().type === 'location';

function setQ(question, hint = '', soft = false) {
  $('question').textContent = question;
  $('hint').textContent = hint;
  $('hint').classList.toggle('soft', soft);
}
const setTotal = () => { $('tot').textContent = `${total} PTS`; };

function readyAction() {
  $('action').textContent = w().lock;
  $('action').hidden = pick == null;
}

function startRound() {
  phase = 'guess';
  pick = null;
  if (marker) { marker.remove(); marker = null; }
  const setEmpty = () => { map.getSource('truth').setData(EMPTY); map.getSource('line').setData(EMPTY); };
  if (ready) setEmpty(); else map.once('load', setEmpty);
  if (ord > 0) map.easeTo({ center: [10, 25], zoom: 1.6, duration: RM ? 0 : 1200 }); // last reveal's zoom would be a hint
  $('reveal').hidden = true;
  $('action').hidden = true;
  hud($('rno'), $('bar'), ord, game.rounds.length);
  setQ(round().question, w().hint[round().type]);
  stage(map, !isLoc());
  $('answer').hidden = isLoc();
  if (!isLoc()) answerWidget($('answer'), round(), { onChange: (v) => { pick = v; readyAction(); }, onEnter: confirmGuess });
}

function place(lat, lng) {
  if (phase !== 'guess' || !isLoc()) return;
  if (marker) marker.remove(); // a fresh marker replays the drop
  marker = new maplibregl.Marker({ element: pinElement(), draggable: true, anchor: 'bottom' }).setLngLat([lng, lat]).addTo(map);
  $('action').textContent = w().lock;
  $('action').hidden = false;
  setQ(round().question, 'Drag the pin to fine-tune', true);
}
map.on('click', (e) => place(e.lngLat.lat, e.lngLat.wrap().lng));

// Untrusted server/user text only via textContent (el / flaps).
function showReveal(r, g) {
  const box = $('reveal'), t = r.truth, rd = round();
  box.replaceChildren();
  const add = (node) => { box.appendChild(node); return node; };
  add(verdictChip(r.points));
  countUp(add(el('div', 'pts')), r.points);
  if (r.points >= 100) confetti();
  const answer = (label) => { if (label) add(label.length <= 26 ? flaps(label, true) : el('div', 'ans', label)); };
  if (rd.type === 'location') {
    add(el('div', 'note', `${r.km} km away`));
    answer(t.answer || [t.city, t.country].filter(Boolean).join(', '));
  } else if (rd.type === 'choice') {
    const list = add(el('div', 'opts-r'));
    rd.options.forEach((o, i) => list.appendChild(el('div', `o${i === t.correct ? ' right' : ''}${i === g.answer ? ' mine' : ''}`,
      `${i === t.correct ? '✓' : i === g.answer ? '✗' : '·'}  ${o}`)));
    if (t.answer !== rd.options[t.correct]) answer(t.answer);
  } else if (rd.type === 'number') {
    const u = t.unit ? ` ${t.unit}` : '';
    add(el('div', 'note', `you said ${fmtNum(g.answer)}${u} · off by ${fmtNum(Math.abs(g.answer - t.value))}${u}`));
    answer(t.answer);
  } else {
    add(el('div', 'note', `you said “${g.answer}”`));
    answer(t.answer);
  }
  if (t.photo) {
    const img = add(el('img'));
    img.src = `/uploads/${t.photo}`; img.alt = t.answer || 'photo'; img.loading = 'lazy';
  }
  if (t.story) add(el('div', 'story', t.story));
  box.hidden = false;
  box.scrollTop = 0;
  total += r.points;
  setTotal();
}

async function confirmGuess() {
  if (phase !== 'guess' || (isLoc() ? !marker : pick == null)) return;
  phase = 'reveal';
  $('action').hidden = true;
  const g = isLoc() ? (({ lat, lng }) => ({ lat, lng }))(marker.getLngLat().wrap()) : { answer: pick };
  let r;
  try {
    const resp = await api('/guess', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ ord: round().ord, ...g }) });
    if (!resp.ok) throw new Error(resp.status);
    r = await resp.json();
  } catch { phase = 'guess'; $('action').hidden = false; setQ(round().question, 'Network hiccup — try again', true); return; }
  guesses.push({ ord: round().ord, ...g });
  $('answer').hidden = true;
  if (isLoc()) {
    const { lat, lng } = g;
    const tf = truthFeature(r.truth);
    map.getSource('truth').setData(tf);
    map.getSource('line').setData({ type: 'Feature', geometry: {
      type: 'LineString', coordinates: [[lng, lat], [r.nearest.lng, r.nearest.lat]] } });
    const bounds = extendBy(new maplibregl.LngLatBounds([lng, lat], [lng, lat]), tf.geometry);
    const padding = innerWidth < 700 ? { top: 190, bottom: innerHeight * 0.5, left: 40, right: 40 } : { top: 170, bottom: 110, left: 60, right: 380 };
    map.fitBounds(bounds, { padding, maxZoom: 9, duration: RM ? 0 : 1200 });
  }
  showReveal(r, g);
  setQ(round().question);
  $('action').textContent = ord === game.rounds.length - 1 ? w().results : w().next;
  $('action').hidden = false;
}

function nextRound() {
  if (phase !== 'reveal') return;
  if (ord < game.rounds.length - 1) { ord += 1; startRound(); }
  else finish();
}

function showBoard(title, mine, leaderboard) {
  phase = 'done';
  $('reveal').hidden = true;
  $('action').hidden = true;
  stage(map, true);
  $('endtitle').textContent = title;
  $('endtotal').textContent = mine == null ? '' : `${mine} pts`;
  finalBoard($('board'), (leaderboard || []).map((p) => ({ name: p.player_name, total: p.total,
    me: p.player_name.toLowerCase() === playerName.toLowerCase() })));
  $('endov').hidden = false;
}

async function finish() {
  setQ('Adding you to the leaderboard…');
  $('action').hidden = true;
  $('reveal').hidden = true;
  let resp;
  try {
    resp = await api('/plays', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ player_name: playerName, guesses }) });
  } catch { phase = 'reveal'; $('action').hidden = false; setQ(round().question, 'Network hiccup — try again', true); return; }
  const d = await resp.json();
  if (resp.status === 409) showBoard(`${playerName}, you already played this one`, null, d.leaderboard);
  else showBoard(game.title, d.total, d.leaderboard);
}

$('action').addEventListener('click', () => (phase === 'guess' ? confirmGuess() : nextRound()));
$('start').addEventListener('click', () => {
  const name = $('pname').value.trim();
  if (!name) return $('pname').focus();
  playerName = name;
  try { localStorage.setItem('maptap:player', name); } catch {}
  $('nameov').hidden = true;
  setTotal();
  startRound();
});
$('pname').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('start').click(); });

window.playState = { place, confirm: confirmGuess, next: nextRound, // debug/driver handle
  answer: (v) => { pick = v; readyAction(); } };

stage(map, true);
(async () => {
  try {
    const resp = await api('');
    if (!resp.ok) throw new Error(resp.status);
    game = await resp.json();
  } catch { setQ('Could not load this game.', 'Check the link', true); return; }
  applyTheme(game.theme);
  document.title = game.title;
  $('gtitle').textContent = game.title;
  $('wtitle').textContent = game.title;
  $('start').textContent = w().play;
  if (!game.rounds.length) { setQ('This game has no rounds yet.'); return; }
  phase = 'name';
  setQ('Ready?');
  $('pname').value = playerName;
  $('nameov').hidden = false;
})();
</script>
</body>
</html>
